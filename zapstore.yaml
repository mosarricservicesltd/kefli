# The Zapstore listing (zsp v0.4.17), at the repository root because Zapstore reads it from there: when the app event
# arrives, it checks that `pubkey` here is the key that signed it, which is how Kefli's publisher is approved. Published
# offline: zsp builds the events for the Kefli account unsigned, the files go to Zapstore's Blossom server, and Amber
# signs through the repo's bunker connection. apps/mobile/scripts/build-release.sh builds the APK.
pubkey: npub1gltmgu8m23txy5sxragwgek7wv4shvgxnezy4zw3npc98sgey3dsfwgf2r
release_source: ./apps/mobile/dist/kefli-1.0.0.apk
repository: https://github.com/mosarricservicesltd/kefli
name: Kefli
summary: Save anything, read it clean and offline, listen to it.
description: |
  Kefli is a free read-it-later app. Share an article to Kefli from any app, or save it from the browser extension,
  and Kefli keeps a clean, readable copy on your phone to read offline or listen to with your phone's own voice.

  Your library is encrypted under your own key and backed up on decentralised storage, so it outlives the service.

  - No signup, no ads, no tracking
  - A calm reading view, offline
  - Listen to anything you've saved, with on-device speech
  - A browser extension for Chrome and Firefox

  Get the browser extension at https://kefli.app/extension. More about Kefli at https://kefli.app.
license: AGPL-3.0-or-later
website: https://kefli.app
icon: ./apps/mobile/assets/brand/icon.png
