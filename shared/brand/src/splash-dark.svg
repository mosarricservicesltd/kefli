<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <!--
    FROZEN ARTWORK (flow decision 70). The launch-screen mark for a dark background (the dark theme's background,
    #111112). On dark, foreground.svg's ink outline and ink read part would vanish, so this is foreground.svg's
    bookmark with the ink turned to paper (#F3F2EE), and the bar drawn as a paper outline ring and read pill: a solid paper
    bookmark, a paper outline round the bar, the read two thirds in paper and the unread slot open, so the slot
    always shows the splash's own background colour. Same canvas, same 96% scale and same shapes as
    foreground.svg, so it has the light splash's size and footprint.
  -->
  <g transform="translate(54 54) scale(0.96) translate(-54 -54)">
    <!-- bookmark: the 3-unit stroke and the fill, both paper -->
    <path d="M41 25H67A4 4 0 0 1 71 29V64.24A1.5 1.5 0 0 1 68.68 65.5L54 56L39.32 65.5A1.5 1.5 0 0 1 37 64.24V29A4 4 0 0 1 41 25Z" fill="none" stroke="#F3F2EE" stroke-width="3" stroke-linejoin="round"/>
    <path d="M41 25H67A4 4 0 0 1 71 29V64.24A1.5 1.5 0 0 1 68.68 65.5L54 56L39.32 65.5A1.5 1.5 0 0 1 37 64.24V29A4 4 0 0 1 41 25Z" fill="#F3F2EE"/>
    <!-- shelf = reading-progress bar: the track's outline and the read two thirds in paper; the track itself is open -->
    <rect x="30" y="70" width="48" height="9" rx="4.5" fill="none" stroke="#F3F2EE" stroke-width="3"/>
    <rect x="30" y="70" width="32" height="9" rx="4.5" fill="#F3F2EE"/>
  </g>
</svg>
