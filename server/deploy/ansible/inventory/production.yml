# The production host (server/deploy/README.md). ansible_host is the `kefli` alias in ~/.ssh/config, which run.sh
# mounts, so Ansible logs in exactly as `ssh kefli` does: 2.31.53.13 as richard with ~/.ssh/id_ed25519_kefli.
# kefli_ssh_allow4 is the nftables SSH allowlist; when the home address changes, change it here and deploy.
operator:
  hosts:
    kefli-1:
      ansible_host: kefli
      kefli_ssh_allow4: [86.188.26.146]
      # The Hetzner Storage Box the nightly backups go to (README, "Backups"), over SFTP on port 23. Its host key is
      # pinned: the fingerprint, SHA256:XqONwb1S0zuj5A1CDxpOSuD2hnAArV1A3wKY7Z3sdgM, is the one Hetzner publishes.
      kefli_backup_box:
        user: u688582
        host: u688582.your-storagebox.de
        host_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICf9svRenC/PLKIL9nk6K/pxQgoiFC41wTNvoIncOxs
