# Shelf local Blossom server: the mirror (contract section 5). Ciphertext only, so one rule for every type.
publicDomain: ""
host: "0.0.0.0"
port: 3448
database:
  path: "/data/sqlite.db"
storage:
  backend: local
  local:
    dir: "/data/blobs"
  rules:
    - type: "*"
      expiration: "1 year"
upload:
  enabled: true
  requireAuth: true
  maxSize: 16777216
mirror:
  enabled: true
  requireAuth: true
delete:
  requireAuth: true
list:
  enabled: false
landing:
  enabled: false
