<title>Shelf Negative-Space Icons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Martian+Mono:wght@400..600&display=swap">
<style>
/* Layout: a review board in Shelf's own chrome, as the earlier icon study. The options as a picker on the left,
   grouped by direction; the chosen option in context on the right (a tall sticky panel on wide screens, first on
   phones). Above both, every option side by side at real size. Page colours are Shelf's ink and paper tokens
   (tokens.json 1.0.1); icons, wallpapers and drawn system UI carry their own colours as content. */
:root{
  --bg:#F3F2EE; --surface:#FFFFFF; --line:#DEDCD5; --line-strong:#8C8A83; --text:#17171A; --muted:#5C5B56;
  --fill:#17171A; --on-fill:#F3F2EE; --focus:#17171A;
  --font-ui:'Archivo',Roboto,'Segoe UI',system-ui,sans-serif;
  --font-mono:'Martian Mono','Roboto Mono',ui-monospace,Consolas,monospace;
  --wall-light:#E4DCCB; --wall-dark:#14171E; --graphite:#111112; --paper:#F3F2EE; --ink:#17171A;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111112; --surface:#1A1A1C; --line:#2E2E31; --line-strong:#7A7983; --text:#EDECE8; --muted:#A7A59F;
  --fill:#EDECE8; --on-fill:#111112; --focus:#EDECE8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111112; --surface:#1A1A1C; --line:#2E2E31; --line-strong:#7A7983; --text:#EDECE8; --muted:#A7A59F;
  --fill:#EDECE8; --on-fill:#111112; --focus:#EDECE8; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding-inline:20px;padding-block:36px 64px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-stretch:125%;font-weight:750;letter-spacing:-.025em;font-size:clamp(30px,4vw,44px);line-height:1.1}
h2{font-stretch:125%;font-weight:720;letter-spacing:-.02em;font-size:22px;line-height:1.2}
h3{font-size:13px;font-weight:600;color:var(--muted)}
p{margin:0}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:-.02em;color:var(--muted)}
.mono{font-family:var(--font-mono);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

header{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px 48px;align-items:start;padding-bottom:32px;border-bottom:1px solid var(--line)}
header .lede{margin-top:14px;max-width:64ch;font-size:16px}
header .lede + p{margin-top:10px;max-width:64ch}
.stays{margin-top:20px;font-size:14px;display:grid;gap:6px;max-width:72ch}
.stays b{font-weight:600}
.learned{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:grid;gap:8px;font-size:14px}
.learned ul{margin:0;padding-left:18px;display:grid;gap:6px}

/* every option side by side, real size */
.lineup{margin-top:32px;display:grid;gap:12px}
.lineup .head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.lineup .head p{font-size:14px;color:var(--muted);max-width:70ch}
.rows{display:grid;gap:8px}
.lrow{overflow-x:auto;border-radius:12px;box-shadow:0 0 0 1px var(--line)}
.lrow .in{display:flex;gap:6px;padding:16px 14px 12px;min-width:max-content}
.lrow button{all:unset;cursor:pointer;display:grid;justify-items:center;gap:6px;width:76px;font-size:11px;line-height:1.25;text-align:center;border-radius:10px;padding:6px 2px}
.lrow button:focus-visible{outline:2px solid currentColor;outline-offset:1px}
.lrow button[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px currentColor}
.lrow .tb{display:flex;align-items:center;gap:14px;padding:10px 14px;min-width:max-content;font-size:12px}
.lrow .tb span.k{display:inline-flex;align-items:center;gap:6px}

.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,560px);gap:40px;margin-top:40px;align-items:start}
.panel{position:sticky;top:16px;align-self:start;max-height:calc(100vh - 32px);overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;scroll-margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.peek{display:none}
.pickers{display:grid;gap:34px}
.group{display:grid;gap:12px}
.group-head{display:grid;gap:4px}
.group-head p{font-size:14px;color:var(--muted);max-width:62ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.cand{display:flex;gap:14px;align-items:flex-start;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:inherit;font:inherit;text-align:left;cursor:pointer}
.cand:hover{border-color:var(--line-strong)}
.cand[aria-pressed="true"]{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
.cand .meta{display:grid;gap:4px;min-width:0}
.cand .meta b{font-weight:600;font-size:15px;line-height:1.25}
.cand .meta .mono{font-size:11px;color:var(--muted)}
.cand .meta .one{font-size:13px;color:var(--muted);line-height:1.4}
.pickmark{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;background:var(--fill);color:var(--on-fill);font-size:11px;font-weight:600;line-height:1;margin-left:6px;vertical-align:2px}

/* icons: an inline SVG tile clipped to a launcher mask */
.ico{display:block;flex:none;overflow:hidden}
.ico svg{display:block;width:100%;height:100%}
.squircle{clip-path:url(#m-squircle)} .circle{border-radius:50%} .rounded{border-radius:22%} .teardrop{border-radius:50% 50% 16% 50%}

.panel .top{display:grid;gap:8px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;border:1px solid var(--line-strong);font-size:12px;font-weight:550;line-height:1}
.sec{margin-top:24px;display:grid;gap:10px}
.hero{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.hero figure,.shapes figure,.screens figure,.pix figure,.pair figure{margin:0;display:grid;gap:6px;font-size:12px;color:var(--muted);justify-items:center;text-align:center}
.wallbox{border-radius:12px;padding:16px;display:grid;place-items:center;box-shadow:0 0 0 1px var(--line)}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pair .walls{display:grid;grid-template-columns:1fr 1fr;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px var(--line);width:100%}
.pair .walls div{display:flex;align-items:center;justify-content:center;padding:16px 0}
.home{border-radius:10px;padding:18px 10px 12px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;box-shadow:0 0 0 1px var(--line)}
.home .app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;line-height:1.2}
.home .app span.i{width:48px;height:48px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center}
.home .app span.i svg{display:block}
.shapes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:400px}
.screens{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:380px}
.screens .scr{width:100%;aspect-ratio:9/16;border-radius:16px;display:grid;place-items:center;box-shadow:0 0 0 1px var(--line)}
.chrome{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;font-size:12px}
.chrome .tab{display:flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:7px 7px 0 0}
.chrome .omni{flex:1;min-width:0;height:26px;border-radius:13px;padding:0 10px;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
.chrome svg{width:16px;height:16px;display:block;flex:none}
.pix{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.pix canvas{image-rendering:pixelated;display:block;border-radius:2px;box-shadow:0 0 0 1px var(--line)}
/* the lock screen's media notification, drawn generically (Android 13+ layout) */
.lock{border-radius:16px;padding:14px;background:linear-gradient(160deg,#20242C,#0E1014);color:#F2F2F2;display:grid;gap:12px;box-shadow:0 0 0 1px var(--line)}
.status{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500}
.status .sp{margin-left:auto;display:flex;gap:6px;opacity:.85}
.media{border-radius:20px;background:#2A2F38;padding:14px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.media .art{width:64px;height:64px;border-radius:10px;overflow:hidden}
.media .app{display:flex;align-items:center;gap:6px;font-size:12px;opacity:.85}
.media .t{font-weight:600;font-size:15px;line-height:1.25}
.media .s{font-size:12px;opacity:.75}
.media .ctl{grid-column:1/-1;display:flex;align-items:center;gap:14px}
.media .bar{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.25);position:relative}
.media .bar i{position:absolute;inset:0 62% 0 0;border-radius:2px;background:#F2F2F2}
.media .pp{width:40px;height:40px;border-radius:12px;background:#F2F2F2;color:#1B1E24;display:grid;place-items:center}
.notes{display:grid;gap:8px;font-size:14px}
.notes .who{font-weight:600}
.notes dl{margin:0;display:grid;gap:8px}
.notes dt{font-size:12px;font-weight:600;color:var(--muted)}
.notes dd{margin:0}
.judges{display:grid;gap:8px;font-size:14px}
.why-pick{font-size:14px;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.why-pick a{color:inherit;text-decoration-thickness:1px;text-underline-offset:2px}
.judges p{padding-left:12px;border-left:2px solid var(--line)}
/* D's height: construction and the icon at launcher size, side by side */
.dstudy{margin-top:48px;padding-top:28px;border-top:1px solid var(--line);display:grid;gap:16px}
.dstudy:empty{display:none}
.dstudy .head{display:grid;gap:8px;max-width:78ch}
.dstudy .head p{font-size:14px;color:var(--muted)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;align-content:start}
.dcard h3{font-size:15px;color:var(--text);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dcard .cons{width:100%;max-width:240px;aspect-ratio:1;border-radius:10px;overflow:hidden;justify-self:center}
.dcard .cons svg{display:block;width:100%;height:100%}
.dcard .row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.dcard .row .wb{border-radius:10px;padding:10px;display:grid;place-items:center}
.dcard p{font-size:13px;color:var(--muted)}
.dcard p.cap{font-size:11px;text-align:center;margin-top:-6px}
.dcard .px canvas{image-rendering:pixelated;display:block}
/* round one: every candidate, smaller, each with why it stopped */
.tried{margin-top:48px;padding-top:28px;border-top:1px solid var(--line);display:grid;gap:14px}
.tried .head{display:grid;gap:4px}
.tried .head p{font-size:14px;color:var(--muted);max-width:76ch}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.tcard{display:flex;gap:12px;align-items:flex-start;width:100%;padding:10px;border-radius:12px;border:1px solid var(--line);background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}
.tcard:hover{border-color:var(--line-strong)}
.tcard[aria-pressed="true"]{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
.tcard .meta{display:grid;gap:3px;min-width:0;font-size:13px;line-height:1.4}
.tcard .meta b{font-size:14px;font-weight:600}
.tcard .meta .mono{font-size:11px;color:var(--muted)}
.tcard .meta .why{color:var(--muted)}
.tcard .meta .dev{font-weight:600;color:var(--text)}
footer{margin-top:48px;padding-top:24px;border-top:1px solid var(--line);display:grid;gap:8px;max-width:76ch;font-size:14px}
footer p:first-child{font-size:16px;font-weight:600}

@media (max-width:1000px){
  header{grid-template-columns:1fr}
  .layout{grid-template-columns:1fr}
  .panel{position:static;align-self:auto;order:-1;max-height:none;overflow:visible}
  .peek{position:sticky;top:8px;z-index:2;display:flex;align-items:center;gap:10px;height:56px;padding:0 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line-strong);color:inherit;text-decoration:none;font-size:14px}
}
@media (max-width:440px){
  .wrap{padding-inline:16px}
  .home .app span.i{width:42px;height:42px}
  .shapes{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:no-preference){.cand{transition:border-color .12s}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <clipPath id="m-squircle" clipPathUnits="objectBoundingBox"><path id="sq-path" d=""/></clipPath>
</defs></svg>

<div class="wrap">
  <header>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="h1"></h1>
      <p class="lede" id="lede"></p>
      <p class="muted" id="lede2"></p>
      <div class="stays" id="stays"></div>
    </div>
    <div class="learned" id="learned"></div>
  </header>

  <section class="lineup" aria-labelledby="h-line">
    <div class="head"><h2 id="h-line">Side by side</h2><p>Every option at real size: on a dark and a light home screen at 48 px, and in a browser toolbar at 16 px. Select one to see it in context below.</p></div>
    <div class="rows" id="rows"></div>
  </section>

  <div class="layout">
    <div class="pickers" id="pickers">
      <a class="peek" id="peek" href="#panel"></a>
    </div>
    <aside class="panel" id="panel" aria-live="polite" aria-label="The chosen option in context"></aside>
  </div>

  <div id="studies"></div>

  <section class="tried" id="tried" aria-labelledby="h-tried"></section>

  <footer id="footer"></footer>
</div>

<script>
const DATA = {"page":{"eyebrow":"Shelf · app icon · negative space","h1":"Negative space","lede":"One paper bookmark on graphite, as you described, with every dark shape in it cut right through. Four options, each shown at 90% of its drawn size for room round the mark, each drawn again by hand at 48, 32 and 16 px, and the 18 ideas they came from.","lede2":"Pick an option to see it beside today's icon, on home screens, in the launcher's shapes, on the lock screen while Shelf reads aloud, at real size in a browser toolbar, and on both launch screens.","stays":[["Changes with the choice:","the launcher and Play Store icons, the themed icon, the notification glyph, both launch screens, and the extension's and website's icons. The cover pattern and the progress bar leave the icon."],["Stays as it is:","the bookmark's shape (square shoulders, the shallow notched tail), the in-app icons, and every save's own cover."],["Why holes:","every dark shape inside the bookmark is a hole, so one drawing gives the light version, the themed icon and the glyph, and they can't drift apart."]],"learned":{"title":"How this round was made","items":["Seven designers each took one direction: your nest, a play cut, a pause made from the bookmark, the tail as the play, figure and ground swapped, a figure hidden in a gap, and the ribbon from the top edge. They drew 18 candidates on Shelf's own bookmark.","Each was checked on a contact sheet at real size: four launcher masks, the themed icon, both home screens at 1×, the toolbar cuts magnified, and the status bar.","Three judges scored all 18 separately: the idea and its negative space (with a search of other reading and listening apps' icons), craft at small sizes, and your brief.","The three shortlisted were redrawn on one shared bookmark, so switching between them changes only the cut, then checked and corrected by someone who hadn't drawn them.","D, the split with h1's tail play, was drawn after you asked for it, then redrawn three plays tall after your designer friend's notes. Every option is now shown at 90% in the launcher's tile; the 48, 32 and 16 px cuts keep their size, since at toolbar sizes that room would cost legibility.","Last, a reviewer with no context saw the icons among other apps, unlabelled, and said what each looked like; their read is in each option's notes. They also noticed the graphite tile almost vanishes on a dark home screen, so the paper shape floats beside coloured icons."]},"groups":[{"title":"The shortlist","text":"D, the split with h1's tail play, is the app icon (flow decision 94). C, A and B stay for comparison.","ids":["D","C","A","B"]},{"title":"For comparison","text":"Shelf's bookmark with no cut, at the size every option shares. It is also the plain mark for places that only save, such as the extension's toolbar button.","ids":["base"]}],"pick":"D","tried":{"title":"Also tried","text":"All 18 round-one candidates, with why each stopped there. Select one to see it in context.","items":[{"id":"n1","became":"Developed into B.","why":"Your idea drawn straight. The judges asked for Shelf's own play, cut parallel to the notch, and a pause with real weight: at 1× its thin bars were specks."},{"id":"p2","became":"Developed into A.","why":"The play is the notch folded forward, at the angle of the app's own play button. It sat low enough to look slipped, so A raises it."},{"id":"s1","became":"Developed into C, and with h1's tail into D.","why":"The only candidate where a single cut makes both ideas, and the one all three judges shortlisted. C narrows the slot so the bookmark reads first."},{"id":"n3","became":"Folded into B.","why":"Its play is cut parallel to the notch and its pause survives to 32 px, but the hole left a 4 dp frame, and an outlined bookmark reads as not saved."},{"id":"p1","became":"Folded into A.","why":"The best-placed play of the round, and its whole-pixel 16 px play is in A. The soft equilateral play itself is the generic media one."},{"id":"h1","why":"The most original idea: one cut turns the left tail into a play. On its own, the diagonal across the whole bookmark reads as the 'bookmark off' slash: the reviewer with no context saw a crossed-out box.","became":"Its tail cut is in D."},{"id":"n2","why":"n1 with less of everything: a small play window with a pause too small to see below the launcher, and the look of a badge stamped on a bookmark."},{"id":"p3","why":"A play small enough to vanish on a home screen: a badge on the bookmark, and the closest of all to GoodLinks' starred bookmark."},{"id":"s3","why":"A pause stamped into the bookmark, and at 16 px two slots over the notch read as a face. C says pause with one cut."},{"id":"s2","why":"Carried up as a slot, the notch reads as a Π, trousers or rocket fins, and says neither bookmark nor pause."},{"id":"t1","why":"On its side, with the notch deepened to read as a play, it stops being Shelf's bookmark: a tag, a ticket or a > prompt first."},{"id":"t2","why":"Play beside pause is the media toggle, so it reads as a remote before a reading app, and the bookmark is on its side."},{"id":"i1","why":"Inside out: a white disc with a dark bookmark. It loses your white bookmark, is the brightest icon on a dark home screen, and the disc is Spotify's layout."},{"id":"i2","why":"A page with a bookmark cut from its head: Material's stock book glyph, with nothing about listening."},{"id":"h2","why":"Two bookmarks and a play make three pieces. The play reads as dropped under the front bookmark, and it is gone at 16 px."},{"id":"r1","why":"A ribbon hanging off the top edge is Day One's icon, and the launcher's mask, not Shelf, decides the shape of its top."},{"id":"r2","why":"C without the bookmark's head: off the edge it reads as two bars first, and on light wallpapers the dark tile reads as a W."},{"id":"r3","why":"Your three levels on the ribbon: the pause is a smudge below the launcher, and it has r1's problems with the bleed."}]},"footer":["To choose, tell Claude the option's letter, for example C.","A new flow decision then replaces decisions 70 and 72. The chosen drawing is frozen in shared/brand/src: the master as the adaptive icon's foreground on a flat #111112 background, the same shape as the monochrome layer, and the cuts and glyph as drawn here. build-icons.cjs needs updating for it, since today's build checks for the cover background and the paper mark's ink outline.","The extension only saves pages, so whichever option you choose, its toolbar icon could be the plain bookmark instead. That is a separate choice."],"open":"D","pickWhy":"Made official on 9 October 2026 as flow decision 94: frozen in shared/brand/src and built into every icon file.","pickLabel":"Chosen","pickWhyLabel":"Status","studies":[{"title":"D, a tad shorter","text":["Your designer friend's notes on D: a tad shorter; its height set by three play buttons, the bottom one facing right, the middle left and the top right; and the room round it that the light and themed versions have.","D's two cuts lie on the notch's two angles, so those angles already make a grid of plays up the left half, outlined in orange: the bottom one is the play with the cut above it. At the old angle three of them stood 2.6 dp taller than D, so shortening D moved it away from three plays. At 30 degrees the plays become equilateral and three of them are exactly the height, 6.5% shorter, so the two notes meet there. The notch is then 3 degrees shallower than today's bookmark.","You chose three plays, smaller, and then a bigger play for it: that is D in the options above, with its 48, 32 and 16 px cuts drawn. Every option is shown at 90%.","A reviewer with no context, shown the new D and the earlier one without names, judged the new one better drawn: its halves keep a bookmark's squat shape and it sits in the tile like the other options, where the earlier D looked a size bigger and more like a pause sign."],"pick":"D-three-90","items":[{"id":"D-was","label":"D before","note":"The first D: today's notch, 32.9 degrees, 43.5 × 53.7 dp. The play is 0.39 of the height; three plays would stand 2.6 dp above the top."},{"id":"D-short","label":"A tad shorter","note":"Today's angle, 6.5% shorter: 43.5 × 50.2 dp. The play is unchanged, so it grows to 0.41 of the height, and three plays overshoot by 6.1 dp."},{"id":"D-three","label":"Three plays","note":"The notch at 30 degrees: the plays are equilateral, and three interlocked plays are exactly the height, 43.5 × 50.2 dp. The play is 0.36 of the height."},{"id":"D-three-90","label":"Three plays, smaller","note":"Three plays at 90%: 39.2 × 45.2 dp of the 72 dp the launcher shows. Chosen, then given a bigger play (below)."}],"pickLabel":"Chosen","key":"dstudy"},{"key":"dplay","title":"D, the play's weight","text":["The blind reader's main note on D: the two bars read as pause first, and the play under the left one is small. The earlier, larger D had one advantage, its bigger triangle.","Narrowing the diagonal cut to 0.8 of the slot's width makes the play 8% taller without changing the height, which the notch sets: three plays as before. The cost is that the two cuts are no longer one width, and the play's tip comes closer to the slot: 1.9 dp in the master against 3.1, and about 1 px at 32 px against 2.","You chose the bigger play: it is now D. The one-width version stays here for comparison."],"cuts":true,"items":[{"id":"D-even","label":"One-width cuts","note":"Slot and diagonal one width, 6.2 dp. Play 17.9 × 15.5 dp before the 90%; its tip 3.1 dp short of the slot. At 48 px the play is 11 px tall, at 32 px 8."},{"id":"D","label":"Bigger play","note":"Diagonal 5.0 dp, 0.8 of the slot. Play 19.4 × 16.8 dp, 8% taller; its tip 1.9 dp short of the slot. At 48 px the play is 12 px tall, at 32 px 9."}],"pick":"D","pickLabel":"Chosen"}]},"cands":[{"id":"D","title":"Split and play","one":"Shelf's bookmark cut twice: the halves make a pause, and the left tail a play.","tags":["Two cuts","Three plays tall","Play from 32 px up"],"idea":"Shelf's bookmark cut twice, with nothing stamped on: a slot down the middle makes the two halves a pause, and the notch's right edge, carried on across the left half, turns the left tail into a play pointing into the gap. Its height is exactly three plays, facing right, left and right, as your designer friend suggested.","built":"The notch is at 30 degrees, so the plays the two cuts' angles make up the left half are equilateral, and the bookmark is exactly three of them tall, interlocked: four notch depths, 1.15 times its width (today's bookmark is 1.24). Drawn 43.5 × 50.23 dp and shown at 90% about the canvas centre, 39.15 × 45.21 dp of the 72 the launcher shows, as every option is. The slot is 1/7 of the width, 6.21 dp; the diagonal is 0.8 of that, 4.97 dp measured square to itself, which makes the play 8% taller than two equal cuts would without changing the height. The play is 19.37 × 16.78 dp before scaling, 0.39 of the height, and its tip stops 1.86 dp short of the slot. Corners follow what made them: the outline's square shoulders take 4/34 of the width, every corner a cut makes takes the tips' 1.5/34.","corners":"A corner's radius follows what made it. The outline's square shoulders take 4/34 of the width; every corner a cut makes (the tips, the slot's corners, the diagonal's and the play's) takes the tips' 1.5/34. In the pixel cuts every cut corner is sharp.","small":"48 px: a 28 × 32 px bookmark with an 8 px notch, so four notch depths are the height and the three plays land on whole pixels; a 4 px slot (1/7) and a diagonal dropped 4 px, 3.47 px square to itself. The play is 12 px tall, its axis on a pixel boundary so its edges rasterise alike, and its tip stops 1.5 px short of the slot. 32 px: 21 × 24 px with a 6 px notch (four depths again) and a 3 px slot; the play is 9 × 7.88 px with its tip 1.13 px short of the slot; like C's, this cut sits half a pixel left of the tile's centre, because a 3 px slot needs an odd-width bookmark. 16 px: the split alone, 9 × 10 px with a 1 px slot and 45 degree stairs for feet: a 3 px play here turned into a nick in the bar at real size. Glyph: the plain bookmark on D's proportions, 16 × 18 px, since a play and pause glyph would sit beside the media card's real play and pause button. The pixel cuts keep their size; only the launcher drawing is shown at 90%. The extension's toolbar button is the plain bookmark at 16 and 32 px (10 × 12 and 20 × 24 px, each four notch depths tall), because the extension only saves and the split reads as a pause control there; the browser tab, the launcher and everything from 48 px up show D.","risks":"A play with a pause is the media toggle, so it can read as a player's control or a music app before a reading app, most of all in the light colourway. The reviewer with no context saw the earlier D as play and pause controls with the left bar snapped off. The left half's lower edge and the right half's foot run as one line from top left to bottom right, the direction of the \"off\" slash, though the slot breaks it. The notch is 3 degrees shallower than today's bookmark, and D's bookmark is 6.5% shorter than the one A, B and C share. The play shows only from 32 px up, and with the bigger play its tip comes within about a pixel of the slot at 32 px. The mark is three pieces, so any one-colour use has to keep both cuts open.","notes":{"judges":{"Blind read":"Of D before its play was enlarged, shown unlabelled beside the earlier, taller D: the reviewer judged it the better drawing, its halves keeping a bookmark's squat shape and its margins matching the other options, where the earlier D looked a size bigger and more like a pause sign. Ranked fourth of seven for saying 'save it and read it aloud', after A, B and the plain bookmark: the first read was still pause or a music player, and at 16 px it became a pause button, as C does. The bigger play answers the first of those; the extension's plain toolbar button answers the second."}},"svg":{"mark":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 108 108\"> \u003cg transform=\"translate(54 54) scale(0.9) translate(-54 -54)\">\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M37.368 28.885L48.974 28.885A1.919 1.919 0 0 1 50.893 30.804L50.893 61.439A1.919 1.919 0 0 1 48.014 63.101L33.21 54.554A1.919 1.919 0 0 1 32.25 52.892L32.25 34.003A5.118 5.118 0 0 1 37.368 28.885ZM35.129 61.403L46.15 67.766A1.919 1.919 0 0 1 46.15 71.09L35.129 77.453A1.919 1.919 0 0 1 32.25 75.791L32.25 63.065A1.919 1.919 0 0 1 35.129 61.403ZM59.026 28.885L70.632 28.885A5.118 5.118 0 0 1 75.75 34.003L75.75 75.791A1.919 1.919 0 0 1 72.871 77.453L58.067 68.905A1.919 1.919 0 0 1 57.107 67.243L57.107 30.804A1.919 1.919 0 0 1 59.026 28.885Z\"/>\u003c/g> \u003c/svg>","c48":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\"> \u003crect width=\"48\" height=\"48\" rx=\"10.5\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" d=\"M13 8L22 8L22 30.857L10 24L10 11A3 3 0 0 1 13 8ZM10 28L20.5 34L10 40L10 28ZM26 8L35 8A3 3 0 0 1 38 11L38 40L26 33.143L26 8Z\"/> \u003c/svg>","c32":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 32 32\"> \u003crect width=\"32\" height=\"32\" rx=\"7\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" d=\"M7 4L14 4L14 21.143L5 16L5 6A2 2 0 0 1 7 4ZM5 19L12.875 23.5L5 28L5 19ZM17 4L24 4A2 2 0 0 1 26 6L26 28L17 22.857L17 4Z\"/> \u003c/svg>","c16":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 16 16\"> \u003crect width=\"16\" height=\"16\" rx=\"3.5\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" d=\"M3 4A1 1 0 0 1 4 3H7V10H6V11H5V12H4V13H3ZM8 3H11A1 1 0 0 1 12 4V13H11V12H10V11H9V10H8Z\"/> \u003c/svg>","glyph":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"> \u003cpath fill=\"#FFFFFF\" d=\"M6 3H18A2 2 0 0 1 20 5V21L12 16.5L4 21V5A2 2 0 0 1 6 3Z\"/> \u003c/svg>","ext16":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 16 16\"> \u003crect width=\"16\" height=\"16\" rx=\"3.5\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" d=\"M4 2H12A1 1 0 0 1 13 3V14L8 11L3 14V3A1 1 0 0 1 4 2Z\"/> \u003c/svg>","ext32":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 32 32\"> \u003crect width=\"32\" height=\"32\" rx=\"7\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" d=\"M8 4H24A2 2 0 0 1 26 6V28L16 22L6 28V6A2 2 0 0 1 8 4Z\"/> \u003c/svg>"}},{"id":"C","title":"Split bookmark","one":"Shelf's bookmark cut once down the middle, so its two halves make a pause sign.","tags":["One cut","Split down to 16 px","Plain glyph"],"idea":"Shelf's bookmark cut once down its centre line. The two halves stand as a pause sign, and the round outer shoulders and the two halves of the notch hold them together as one bookmark. A bookmark and a pause both mean stop here and come back later.","built":"The shared bookmark (candidates/base: 43.5 dp wide, top at 27.1, shown at 90% about the canvas centre, as every option is: reach 29.29 of 33) with a slot down its centre line 1/7 of its width, 6.21 dp. Each half is 3/7 of the width, 18.64 dp, so the slot is exactly a third of a half; a half is 46.9 dp tall, about 1 : 2.5. I chose the width by eye between 0.12 and 0.15: at 0.12 the slot looked like a crack, and at 0.15 the halves began to come apart in the light colourway. 1/7 is also a ratio the 48 and 32 px cuts can draw exactly (4 px in 28, and 3 in 21 once the 32 px bookmark gains a pixel), so one ratio holds from the launcher down to the 32 px cut; the 16 px cut is 1/9. Each foot runs along the base's notch line to the slot, which meets it 2.01 dp below where the apex was, so the eye carries the V across the slot. Corner rule: a corner's radius follows what made it. The outline makes the square shoulders, which keep 4/34 of the width (5.12 dp); cuts make everything else, the notch's tips and the slot's four corners, and those all take the tips' 1.5/34 (1.92 dp). In the pixel cuts every cut corner is sharp, as the base draws its tips. On the bookmark itself this is the judges' rule by angle (90 degree shoulders at 4/34, 57 degree tips at 1.5/34). It differs only at the slot's two top corners, which are right angles. Drawn at the shoulder radius, each half became a rounded bar and the pair read as II before it read as a bookmark; drawn sharp, they looked harder than the tips at 4× and no different at 1×. At 1× the 1.92 dp corners are 1.3 px, as crisp as the tips beside the 3.4 px shoulders.","corners":"A corner's radius follows what made it. The outline makes the square shoulders, which keep 4/34 of the width (5.12 dp); cuts make everything else, the notch's tips and the slot's four corners, and those all take the tips' 1.5/34 (1.92 dp). In the pixel cuts every cut corner is sharp, as the base draws its tips.","small":"The 48, 32 and 16 px cuts keep the slot; the glyph is the plain bookmark. 48 px: the base's 28 × 34 px bookmark with a 4 px slot (1/7) between 12 px halves, the feet on the base's notch line (3.3% soft, as the base). 32 px: the base's 20 px bookmark gains a pixel on the left, because a 3 px slot needs an odd width to sit between whole-pixel halves; on 20 px the centred slots nearest 1/7 are 2 px (0.1) and 4 px (0.2, round one's, which read as a pause sign first). So 21 × 24 px with a 3 px slot (1/7), 9 px halves at the base's notch slope, and the mark half a pixel left of the tile's centre (5.7% soft against the base's 5.2: the same 22 soft pixels, a larger share because the slot takes paper away). 16 px: the bookmark gives up its right-hand pixel, 9 × 12 px, so a 1 px slot can sit between two 4 px halves (1/9, the nearest to 1/7 of any bookmark within a pixel of the base's 10 px; round one's 2 px in 10 was 0.2). The feet leave the base's notch line for whole-pixel stairs at 45 degrees, the angle of the brand's own 16 px notch, so they have no soft pixels; they meet the slot 3 px above the tips, level with the base's apex. This mark is also half a pixel left (2.4% soft against the base's 10.9). Glyph: the plain shared bookmark (6.3% soft, as the base). Drawn split, it sat beside the media card's pause button and read as a second pause button, or as 'paused' in the status bar while Shelf was reading aloud; media-card.png in this folder shows both. So the status bar and the media notification show the bookmark, and the split lives in the launcher icon, the launch screens and the browser.","risks":"It reads as a pause sign, and pause on its own says something is playing now; it suggests listening only to someone who knows Shelf reads aloud. At 1× on a home screen, in the themed icon and at 16 px it can be taken for a pause button before a bookmark; the round shoulders and sloped feet keep it Shelf's. As the extension's toolbar button, which only saves, it could look like a control that pauses the page; the base's plain bookmark is the safer button there. The notch's apex, the bookmark's most recognisable point, is gone, and the shallow V survives as two sloped feet. The light colourway, ink halves on paper, is the nearest to ElevenLabs' II, the best-known mark in text to speech. Measured from its app icon, ElevenLabs' bars are 1 : 4.8 with square ends, the gap is as wide as a bar (a third of the pair's width), and the pair is 0.63 as wide as it is tall and a quarter of the tile's width. Shelf's halves are 1 : 2.8, the slot is a third of a half (a seventh of the pair), the pair is 0.83 as wide as it is tall and fills 60% of the tile's width, with round outer shoulders and sloped feet. At launcher sizes the difference is plain; at 16 px it comes down to the feet. Also near: a Roman numeral II, a parallel sign, a stock pause button. The mark is two pieces, so any one-colour use (print, emboss, a cut sticker) has to keep the slot open, and at 16 px it is one pixel wide. The 32 and 16 px cuts sit half a pixel left of their tiles' centres: with an odd slot the mark is an odd number of pixels wide, so it can't be centred on an even tile.","notes":{"judges":{"Blind read":"Ranked fifth: the strongest pause of the six, and 'a bookmark torn in half', with no sign of listening. Small, it matches D."}},"svg":{"mark":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 108 108\"> \u003cg transform=\"translate(54 54) scale(0.9) translate(-54 -54)\">\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M37.368 27.1L48.974 27.1A1.919 1.919 0 0 1 50.893 29.019L50.893 67.728A1.919 1.919 0 0 1 50.016 69.339L35.212 78.919A1.919 1.919 0 0 1 32.25 77.308L32.25 32.218A5.118 5.118 0 0 1 37.368 27.1ZM59.026 27.1L70.632 27.1A5.118 5.118 0 0 1 75.75 32.218L75.75 77.308A1.919 1.919 0 0 1 72.788 78.919L57.984 69.339A1.919 1.919 0 0 1 57.107 67.728L57.107 29.019A1.919 1.919 0 0 1 59.026 27.1Z\"/>\u003c/g> \u003c/svg>","c48":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\"> \u003crect width=\"48\" height=\"48\" rx=\"10.5\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" d=\"M13 7L22 7L22 33.286L10 41L10 10A3 3 0 0 1 13 7ZM26 7L35 7A3 3 0 0 1 38 10L38 41L26 33.286L26 7Z\"/> \u003c/svg>","c32":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 32 32\"> \u003crect width=\"32\" height=\"32\" rx=\"7\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" d=\"M7 4L14 4L14 22.15L5 28L5 6A2 2 0 0 1 7 4ZM17 4L24 4A2 2 0 0 1 26 6L26 28L17 22.15L17 4Z\"/> \u003c/svg>","c16":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 16 16\"> \u003crect width=\"16\" height=\"16\" rx=\"3.5\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" d=\"M4 2L7 2L7 11L6 11L6 12L5 12L5 13L4 13L4 14L3 14L3 3A1 1 0 0 1 4 2ZM8 2L11 2A1 1 0 0 1 12 3L12 14L11 14L11 13L10 13L10 12L9 12L9 11L8 11L8 2Z\"/> \u003c/svg>","glyph":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"> \u003cpath fill=\"#FFFFFF\" d=\"M6 2H18A2 2 0 0 1 20 4V22L12 17L4 22V4A2 2 0 0 1 6 2Z\"/> \u003c/svg>"}},{"id":"A","title":"Play cut","one":"Shelf's bookmark with one hole: a play cut at the notch's angle.","tags":["Two levels","Play at every size"],"idea":"Shelf's bookmark in paper with one play-shaped hole. The play is the notch turned forward: its slanted edges run parallel to the notch's and are as long, and it has the angle of the play button in Shelf's player, so the tail, the hole and the app's play are one shape.","built":"The shared bookmark (base: 43.5 dp wide, top at 27.1, reach 32.56 of 33 dp), unchanged. The play is the notch's two halves, each 17 units across and 11 up, joined along their 17-unit sides: its flat side is twice the notch's depth (28.15 dp) and its depth half the bookmark's width (21.75 dp), so depth = height × 17/22 and both slanted edges are parallel to the notch (32.9 degrees; the app's Lucide play is 32.7). The flat side is 12.2 dp from the left edge and the drawn tip 11.2 dp from the right; a point carries less weight than a flat side, so these look equal. The axis is at y 49.8, 2.9 dp below the middle of the body (round one's p2 was 4.5 dp below), which leaves 10.2 dp of paper above and a 7.6 dp strap along the notch, parallel to it; the play's lowest point is 4.5 dp above the notch's apex. The hole is 15% of the bookmark. B's play has the same axis and shape, larger.","corners":"Matched by angle, the same rule in A and B. Corners as acute as the tail tips take the tips' radius, 1.5/34 of the bookmark's width (1.92 dp): the play's back corners have exactly the tips' angle (57 degrees) and its point is 66. Right angles take the shoulders' 4/34: 5.12 dp on the bookmark, and 4/34 of a bar's width on B's pause. Shelf's bookmark already works this way: its shoulders and its tips both round off 2.1 dp inside their sharp points. Compared with p1's 3.1 dp at 1x and 4x: on a 1x home screen the two can't be told apart; at 4x 3.1 dp looks softer than the tail tips beside it and closer to Play Books' rounded play, so the tips' radius stays. On the cuts the play keeps that radius, scaled to the cut's bookmark (1.24 px at 48, 0.88 at 32, 0.71 on the glyph), while base draws the cuts' tail tips sharp on pixel corners, so at those sizes the play's corners are a little softer than the tips. Drawn sharp, the play's back corners fall inside pixels and each leaves a stray part-tone pixel (52 soft pixels against 50 at 48, 42 against 39 at 32), so the rounding stays there too.","small":"Every cut is base's bookmark, unchanged. At 48 and 32 px and on the glyph the play is built from that cut's own notch, so it stays parallel to it; at 16 px it is drawn in whole pixels. 48 px: 18 × 14 px (the folded notch exactly), flat side on x 18 with 8 px of paper there, 7 at the tip, 6 above and a 4.9 px strap (the master's 7.6 dp at this scale); its axis is on y 21, a pixel boundary, so its corners land on whole pixels and its two slanted edges are mirror images; 6.9% soft, against the plain bookmark's 3.3. 32 px: 13.5 × 10.4 px on x 11, half a pixel taller than the folded notch, which on whole pixels sits to one side; 5 and 5.4 px at the sides, 4 above, a 3.35 px strap; 10.7% soft (plain 5.2). Whole-pixel stairs were tried at 32 and look like pixel art beside the notch's smooth diagonal. 16 px: p1's whole-pixel play, columns of 5, 3, 3 and 1 from x 6 on rows 4 to 8, with 3 px at each side, 2 above and 2 over the notch's apex, so nothing leaks into the notch; it adds no part-tone pixels (12.2% soft, all from the bookmark's own corners and notch). Glyph: 11 × 8.8 px on x 8, a pixel taller than the folded notch, which sits to the left on whole pixels; its axis is on y 10.5, the middle of a pixel row, so its corners land on whole pixels (y 5 and 16) and the rows either side of the tip are mirror images. 4 and 3.8 px at the sides, 3.6 above and a 3 px strap; 13% soft (plain 6.3). Every size keeps the play.","risks":"Google Play Books pairs the same two signs, and GoodLinks, an Apple-only read-later app, is a white notched bookmark with a symbol in its body. Shelf's square shoulders, the single colour and a cut hole rather than a stamped symbol keep it apart, but among media apps a bookmark with a play can read as a podcast or audiobook app. The rhyme with the notch shows on the launcher; at toolbar sizes this is simply a bookmark with a play. On the launcher the play's corners are crisp beside the round shoulders, on purpose, because they match the tail tips. The extension's toolbar button only saves, so a play there promises listening the extension doesn't offer; base's plain bookmark could stand in for the toolbar cuts.","notes":{"judges":{"Blind read":"Ranked first of six for saying save and listen: the bookmark reads as saved and the play as listen, both at once, and it still works at 16 px. It leans towards video or 'watch later'."}},"svg":{"mark":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 108 108\"> \u003cg transform=\"translate(54 54) scale(0.9) translate(-54 -54)\">\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M37.368 27.1L70.632 27.1A5.118 5.118 0 0 1 75.75 32.218L75.75 77.308A1.919 1.919 0 0 1 72.788 78.919L54 66.762L35.212 78.919A1.919 1.919 0 0 1 32.25 77.308L32.25 32.218A5.118 5.118 0 0 1 37.368 27.1ZM47.412 37.643L63.71 48.189A1.919 1.919 0 0 1 63.71 51.411L47.412 61.957A1.919 1.919 0 0 1 44.45 60.346L44.45 39.254A1.919 1.919 0 0 1 47.412 37.643Z\"/>\u003c/g> \u003c/svg>","c48":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\"> \u003crect width=\"48\" height=\"48\" rx=\"10.5\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M13 7H35A3 3 0 0 1 38 10V41L24 32L10 41V10A3 3 0 0 1 13 7ZM19.903 13.224L30.384 19.961A1.235 1.235 0 0 1 30.384 22.039L19.903 28.776A1.235 1.235 0 0 1 18 27.737L18 14.263A1.235 1.235 0 0 1 19.903 13.224Z\"/> \u003c/svg>","c32":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 32 32\"> \u003crect width=\"32\" height=\"32\" rx=\"7\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M8 4H24A2 2 0 0 1 26 6V28L16 21.5L6 28V6A2 2 0 0 1 8 4ZM12.363 8.136L20.246 13.26A0.882 0.882 0 0 1 20.246 14.74L12.363 19.864A0.882 0.882 0 0 1 11 19.124L11 8.876A0.882 0.882 0 0 1 12.363 8.136Z\"/> \u003c/svg>","c16":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 16 16\"> \u003crect width=\"16\" height=\"16\" rx=\"3.5\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M4 2H12A1 1 0 0 1 13 3V14L8 11L3 14V3A1 1 0 0 1 4 2ZM6 4H7V5H8H9V6H10V7H9V8H8H7V9H6Z\"/> \u003c/svg>","glyph":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"> \u003cpath fill=\"#FFFFFF\" fill-rule=\"evenodd\" d=\"M6 2H18A2 2 0 0 1 20 4V22L12 17L4 22V4A2 2 0 0 1 6 2ZM9.08 5.675L15.842 9.901A0.706 0.706 0 0 1 15.842 11.099L9.08 15.325A0.706 0.706 0 0 1 8 14.726L8 6.274A0.706 0.706 0 0 1 9.08 5.675Z\"/> \u003c/svg>"}},{"id":"B","title":"Play and pause","one":"The bookmark, a dark play inside it and a paper pause inside that.","tags":["Three levels","Pause from 48 px up","Same as A below 48 px"],"idea":"Your idea, cut as one paper shape: the bookmark, a dark play inside it and a paper pause inside the play. The play is A's shape, larger, and the pause has the proportions of the pause button in Shelf's player, so all three are Shelf's own.","built":"The shared bookmark (base), unchanged, and A's construction (B's build imports A's). The play is the largest that leaves 6 dp of paper above it and along the notch: 36.62 × 28.29 dp, on A's axis (y 49.8), with 8.6 dp at the flat side and 8.2 past the drawn tip; its slanted edges are parallel to the notch, as A's are. The pause is the app's: Lucide's pause drawn filled at a 1.75 stroke, as the player shows it, has bars 2.56 times as wide as the gap and 3.09 times as tall as they are wide. Here the bars are 3.69 × 11.38 dp, 1.44 dp apart. The pause starts on the play's incircle (centre 50.83, 49.8, radius 9.96) and sits 1 dp left of it: there the dark is 4.55 dp along the flat side and 3.5 at the bars' outer corners, and because a band running parallel to a bar looks narrower than the same distance at a corner, the ring reads as even. The aim was 4.5 dp bars. With 6 dp walls 3.7 dp is the most that keeps the ring even (3.9 if the pause crowds the flat side). With the ring kept even, 4.5 dp bars need a play 42.3 dp tall, which leaves 3.2 dp of paper above it and along the notch (40.3 dp and 4.2 dp if the pause crowds the flat side): n3's outlined bookmark again.","corners":"A's rule, matched by angle. The play's corners take the tail tips' radius (1.5/34 of the bookmark's width, 1.92 dp), since its back corners have the tips' 57 degree angle and its point is 66. Right angles take the shoulders' 4/34: 5.12 dp on the bookmark, and 4/34 of the bar's width on the pause (0.43 dp). The app's rounder bar ends (a third of the bar's width) were tried too: beside the crisp play they looked soft, so the shoulders' proportion stays. At 48 px the bars are square, on whole pixels.","small":"48 px keeps the pause at its smallest: bars 2 × 7 px with a 2 px gap on whole pixels (x 18 to 24, y 18 to 25), 3 px of dark at the flat side and 2.5 at the corners. The bars, the gap and that 2.5 px of dark at the corners (two pixels on the diagonal) are under this size's 3 px minimum, and the pause still reads as two bars, magnified and at 1x. A full 3 px at the corners needs 6 px bars in a play a pixel left of centre, which looked lopsided, or less than 3 px of paper above the play. At this size the gap is as wide as a bar, because the app's 2.5 to 1 would need 5 px bars. The play has to be 24.5 px tall, which leaves 3.3 px of paper above it and 3.4 along the notch, against the master's 6 dp (3.9 px at this scale); 9.1% soft. 32 px, 16 px and the glyph drop the pause, and B's files there are A's, byte for byte: at 32 px a play with 2 px walls holds 2 px bars with a 2 px ring only if the bars are 3 px tall, which reads as two dots; at 16 px there is no room; and the glyph sits beside the media notification's own play and pause. Without a pause, B's larger play would only thin the paper, so those sizes take A's play. Every cut uses base's bookmark unchanged.","risks":"A play holding a pause is a media player's play/pause button, so this is the most player-like option and the nearest to Google Play Books, which pairs a play and a bookmark. The play takes 36.6 of the bookmark's 52 dp, so the paper is a 6 to 8.6 dp frame round it, the thinnest the judges would accept. The pause bars are 3.7 dp, under the 4.5 dp aim: on a 1x (48 px) home screen they are 2.5 px bars with a 1 px gap and merge into one small patch, while a Pixel's launcher draws about 2 px per dp, which makes them 7 px bars with a 3 px gap. The pause appears wherever the master is used (the launcher and its themed icon, both launch screens, and the mark on paper, as on the website) and in the 48 px cut; the 32 and 16 px cuts and the glyph are A's.","notes":{"judges":{"Blind read":"Ranked second: A's message, but the pause adds clutter and can read as 'paused'. At 16 px it can't be told from A."}},"svg":{"mark":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 108 108\"> \u003cg transform=\"translate(54 54) scale(0.9) translate(-54 -54)\">\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M37.368 27.1L70.632 27.1A5.118 5.118 0 0 1 75.75 32.218L75.75 77.308A1.919 1.919 0 0 1 72.788 78.919L54 66.762L35.212 78.919A1.919 1.919 0 0 1 32.25 77.308L32.25 32.218A5.118 5.118 0 0 1 37.368 27.1ZM43.836 33.408L66.679 48.189A1.919 1.919 0 0 1 66.679 51.411L43.836 66.192A1.919 1.919 0 0 1 40.874 64.581L40.874 35.019A1.919 1.919 0 0 1 43.836 33.408ZM45.861 44.111L48.68 44.111A0.434 0.434 0 0 1 49.113 44.545L49.113 55.055A0.434 0.434 0 0 1 48.68 55.489L45.861 55.489A0.434 0.434 0 0 1 45.428 55.055L45.428 44.545A0.434 0.434 0 0 1 45.861 44.111ZM50.989 44.111L53.807 44.111A0.434 0.434 0 0 1 54.241 44.545L54.241 55.055A0.434 0.434 0 0 1 53.807 55.489L50.989 55.489A0.434 0.434 0 0 1 50.555 55.055L50.555 44.545A0.434 0.434 0 0 1 50.989 44.111Z\"/>\u003c/g> \u003c/svg>","c48":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\"> \u003crect width=\"48\" height=\"48\" rx=\"10.5\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M13 7H35A3 3 0 0 1 38 10V41L24 32L10 41V10A3 3 0 0 1 13 7ZM16.903 10.466L32.451 20.461A1.235 1.235 0 0 1 32.451 22.539L16.903 32.534A1.235 1.235 0 0 1 15 31.495L15 11.505A1.235 1.235 0 0 1 16.903 10.466ZM18 18L20 18L20 25L18 25L18 18ZM22 18L24 18L24 25L22 25L22 18Z\"/> \u003c/svg>","c32":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 32 32\"> \u003crect width=\"32\" height=\"32\" rx=\"7\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M8 4H24A2 2 0 0 1 26 6V28L16 21.5L6 28V6A2 2 0 0 1 8 4ZM12.363 8.136L20.246 13.26A0.882 0.882 0 0 1 20.246 14.74L12.363 19.864A0.882 0.882 0 0 1 11 19.124L11 8.876A0.882 0.882 0 0 1 12.363 8.136Z\"/> \u003c/svg>","c16":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 16 16\"> \u003crect width=\"16\" height=\"16\" rx=\"3.5\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M4 2H12A1 1 0 0 1 13 3V14L8 11L3 14V3A1 1 0 0 1 4 2ZM6 4H7V5H8H9V6H10V7H9V8H8H7V9H6Z\"/> \u003c/svg>","glyph":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"> \u003cpath fill=\"#FFFFFF\" fill-rule=\"evenodd\" d=\"M6 2H18A2 2 0 0 1 20 4V22L12 17L4 22V4A2 2 0 0 1 6 2ZM9.08 5.675L15.842 9.901A0.706 0.706 0 0 1 15.842 11.099L9.08 15.325A0.706 0.706 0 0 1 8 14.726L8 6.274A0.706 0.706 0 0 1 9.08 5.675Z\"/> \u003c/svg>"}},{"id":"base","title":"Plain bookmark","idea":"Shelf's bookmark, solid, at the size every finalist shares: the silhouette the cuts are made in, and the plain mark for places that only save, such as the extension's toolbar button.","built":"geom.bookmark at 43.5 dp wide with today's proportions and its top at 27.1, the largest the 66 dp safe circle allows, then shown at 90% about the canvas centre (39.2 dp wide), as every option is, for room round the mark. Cuts: 28 × 34 px at 48 with a 9 px notch, 20 × 24 at 32 with a 6.5 px notch, 10 × 12 at 16 with a 3 px notch, and 16 × 20 for the glyph with a 5 px notch.","small":"Nothing to drop: every size is the bookmark alone.","risks":"No second idea: it says bookmark and nothing about listening.","notes":{"judges":{"Blind read":"Ranked third: the clearest 'read later', sharp at every size, but nothing about reading aloud, and in a browser toolbar it could pass for the browser's own bookmark button."}},"svg":{"mark":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 108 108\"> \u003cg transform=\"translate(54 54) scale(0.9) translate(-54 -54)\">\u003cpath fill=\"#F3F2EE\" d=\"M37.368 27.1L70.632 27.1A5.118 5.118 0 0 1 75.75 32.218L75.75 77.308A1.919 1.919 0 0 1 72.788 78.919L54 66.762L35.212 78.919A1.919 1.919 0 0 1 32.25 77.308L32.25 32.218A5.118 5.118 0 0 1 37.368 27.1Z\"/>\u003c/g> \u003c/svg>","c48":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\"> \u003crect width=\"48\" height=\"48\" rx=\"10.5\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" d=\"M13 7H35A3 3 0 0 1 38 10V41L24 32L10 41V10A3 3 0 0 1 13 7Z\"/> \u003c/svg>","c32":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 32 32\"> \u003crect width=\"32\" height=\"32\" rx=\"7\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" d=\"M8 4H24A2 2 0 0 1 26 6V28L16 21.5L6 28V6A2 2 0 0 1 8 4Z\"/> \u003c/svg>","c16":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 16 16\"> \u003crect width=\"16\" height=\"16\" rx=\"3.5\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" d=\"M4 2H12A1 1 0 0 1 13 3V14L8 11L3 14V3A1 1 0 0 1 4 2Z\"/> \u003c/svg>","glyph":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"> \u003cpath fill=\"#FFFFFF\" d=\"M6 2H18A2 2 0 0 1 20 4V22L12 17L4 22V4A2 2 0 0 1 6 2Z\"/> \u003c/svg>"}}],"tried":[{"id":"n1","title":"Classic nest","idea":"Richard's idea drawn straight: Shelf's bookmark in paper, the largest play hole its walls allow, and a paper pause sitting on the play's incircle. The play is the dark tile showing through and the pause is the bookmark's own paper again, so one shape carries save, listen and pause.","built":"Bookmark at Shelf's proportions, 43.5 dp wide with its top at 27.1, as large as the 66 dp safe circle allows (reach 32.6 dp). The play is equilateral, 38.3 dp tall, with its corners rounded at the bookmark's shoulder radius (5.1 dp); it is the largest that keeps at least 6 dp of paper round it: 6 at the top corner and over the notch, 8.2 on the left, 7.3 past the drawn tip. Its centroid sits 2.5 dp left of the centre line, which puts the drawn play's box 0.5 dp right of it, halfway between centroid and box centring; that is what looks centred inside a rectangle. The pause sits on the incircle (radius 11.05 dp): bars 3.4 x 11.4 dp, 3.1 dp apart, corner radius 1 dp, with 4 dp of dark to the slanted sides and 6.1 dp to the flat side. The extra on the flat side is deliberate: a gap that runs parallel to a bar looks narrower than the same gap at a corner. One even-odd path.","small":"48 px: bookmark 28 x 34 px, play 24 px tall with its sides at 4:7 (within a degree of equilateral) and r 3 corners, 3.8 to 5 px of paper round it. The pause is dropped there: once a 3 px ring and a 3 px gap come out of a play with a 7 px incircle, 3 px bars could only be about 4 px tall. 32 px: bookmark 20 x 24 px with a 16 px play and 3 to 4 px walls, no pause. 16 px: bookmark 10 x 12 px with a 4 x 7 px play drawn in whole pixels, so it stays crisp. Glyph 24: bookmark 16 x 20 px with a 12 px play hole and at least 3 px of white round it; no pause, since the media notification beside it already carries play and pause. The pause therefore lives only in the launcher icon and on the launch screens.","risks":"Google Play Books also builds its icon from a bookmark-like shape round a play triangle; the pause island, the single colour and Shelf's square shoulders set this apart, and only the last two survive below 64 px. On a home screen at 1x the pause shrinks to two specks and the icon reads as a bookmark with a play button, which could suggest a podcast or video app. The toolbar cuts carry the play alone.","notes":{},"svg":{"mark":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 108 108\"> \u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M37.368 27.1L70.632 27.1A5.118 5.118 0 0 1 75.75 32.218L75.75 77.308A1.919 1.919 0 0 1 72.788 78.919L54 66.762L35.212 78.919A1.919 1.919 0 0 1 32.25 77.308L32.25 32.218A5.118 5.118 0 0 1 37.368 27.1ZM48.122 33.786L65.932 44.068A5.118 5.118 0 0 1 65.932 52.932L48.122 63.214A5.118 5.118 0 0 1 40.446 58.782L40.446 38.218A5.118 5.118 0 0 1 48.122 33.786ZM47.538 42.796L48.96 42.796A1 1 0 0 1 49.96 43.796L49.96 53.204A1 1 0 0 1 48.96 54.204L47.538 54.204A1 1 0 0 1 46.538 53.204L46.538 43.796A1 1 0 0 1 47.538 42.796ZM54.04 42.796L55.462 42.796A1 1 0 0 1 56.462 43.796L56.462 53.204A1 1 0 0 1 55.462 54.204L54.04 54.204A1 1 0 0 1 53.04 53.204L53.04 43.796A1 1 0 0 1 54.04 42.796Z\"/> \u003c/svg>","c48":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\"> \u003crect width=\"48\" height=\"48\" rx=\"10.5\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M13 7L35 7A3 3 0 0 1 38 10L38 41L24 32L10 41L10 10A3 3 0 0 1 13 7ZM19.488 11.315L31.442 18.145A3 3 0 0 1 31.442 23.355L19.488 30.185A3 3 0 0 1 15 27.58L15 13.92A3 3 0 0 1 19.488 11.315Z\"/> \u003c/svg>","c32":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 32 32\"> \u003crect width=\"32\" height=\"32\" rx=\"7\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M8 4L24 4A2 2 0 0 1 26 6L26 28L16 21.5L6 28L6 6A2 2 0 0 1 8 4ZM12.992 7.21L20.961 11.764A2 2 0 0 1 20.961 15.236L12.992 19.79A2 2 0 0 1 10 18.054L10 8.946A2 2 0 0 1 12.992 7.21Z\"/> \u003c/svg>","c16":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 16 16\"> \u003crect width=\"16\" height=\"16\" rx=\"3.5\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M4 2L12 2A1 1 0 0 1 13 3L13 14L8 11L3 14L3 3A1 1 0 0 1 4 2ZM6 4H7V5H8V6H9V7H10V8H9V9H8V10H7V11H6Z\"/> \u003c/svg>","glyph":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"> \u003cpath fill=\"#FFFFFF\" fill-rule=\"evenodd\" d=\"M6 2L18 2A2 2 0 0 1 20 4L20 22L12 17L4 22L4 4A2 2 0 0 1 6 2ZM10.244 5.282L16.221 8.698A1.5 1.5 0 0 1 16.221 11.302L10.244 14.718A1.5 1.5 0 0 1 8 13.415L8 6.585A1.5 1.5 0 0 1 10.244 5.282Z\"/> \u003c/svg>"}},{"id":"p2","title":"Notch-cut play","idea":"The two cuts that make the bookmark's tail, folded to point forward, make the play: its slanted edges run parallel to the notch's and are just as long, so the hole and the tail look cut by the same hand. The play rests on the tail with an even strap of paper along the notch, and its angle is also the angle of the play button inside the app.","built":"Bookmark as p1: 42.5 dp wide, today's proportions, drawn box centred. The play is the notch's triangle folded: its flat side is twice the notch's depth (22 units of 34, 27.5 dp) and its depth half the bookmark's width (17 units, 21.25 dp), so both slanted edges have the notch's slope (32.9 degrees) and length (20.25 units), and the hole has the notch's area. The prototype's Lucide play (polygon 6 3, 20 12, 6 21) slopes at 32.7 degrees, so it is the same shape. Corners r 1.5 units (1.9 dp), the tail tips' radius, because the play's back corners have the tips' 57 degree angle. The flat side sits 0.46 of the depth left of the centre line, leaving 9.2 units of paper at the flat side and 9.1 at the tip. The lower edge is set 5 units square to the notch's left edge: a strap thinner than the 9.2 to 9.4 units at the flat side, tip and top, so the play reads as resting on the tail. The hole is 14.8% of the bookmark.","small":"Each cut builds the play from its own notch, so the edges stay parallel to the notch at every size. 48 px: notch 9 over 14, play 18 x 14 px with its flat side on x 18 (8 px of paper there, 7 at the tip), strap 4 px, 6.6 px above. 32 px: notch 6 over 9, play 12 x 9 px on x 12, strap 2.6 px. 16 px: the play is redrawn in whole pixels as columns of 6, 4, 4 and 2 on x 6, rows 4 to 9, resting on the tail with 2 px above and its lower steps 1 to 2 px from the notch. Glyph: notch 5 over 8, play 10 x 8 px on x 8, strap 3 px. Every cut keeps the play.","risks":"The crisp corners follow the tail tips, so they are much crisper than the round shoulders, and some will read them as sharp. The play sits below the middle on purpose, which out of context can look as if it has slipped. At launcher sizes the difference from p1 is subtle (narrower, crisper, lower), and the notch rhyme is only visible from about 48 px up. Google Play Books pairs the same two symbols; the bookmark silhouette and the hole keep them apart.","notes":{},"svg":{"mark":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 108 108\"> \u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M37.75 28.536L70.25 28.536A5 5 0 0 1 75.25 33.536L75.25 77.589A1.875 1.875 0 0 1 72.356 79.164L54 67.286L35.644 79.164A1.875 1.875 0 0 1 32.75 77.589L32.75 33.536A5 5 0 0 1 37.75 28.536ZM47.119 40.539L63.042 50.843A1.875 1.875 0 0 1 63.042 53.991L47.119 64.294A1.875 1.875 0 0 1 44.225 62.72L44.225 42.113A1.875 1.875 0 0 1 47.119 40.539Z\"/> \u003c/svg>","c48":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\"> \u003crect width=\"48\" height=\"48\" rx=\"10.5\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M13 7L35 7A3 3 0 0 1 38 10L38 41L24 32L10 41L10 10A3 3 0 0 1 13 7ZM19.849 14.189L30.43 20.991A1.2 1.2 0 0 1 30.43 23.01L19.849 29.812A1.2 1.2 0 0 1 18 28.803L18 15.199A1.2 1.2 0 0 1 19.849 14.189Z\"/> \u003c/svg>","c32":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 32 32\"> \u003crect width=\"32\" height=\"32\" rx=\"7\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M9 5L23 5A2 2 0 0 1 25 7L25 27L16 21L7 27L7 7A2 2 0 0 1 9 5ZM13.244 9.371L20.002 13.876A0.8 0.8 0 0 1 20.002 15.207L13.244 19.713A0.8 0.8 0 0 1 12 19.047L12 10.037A0.8 0.8 0 0 1 13.244 9.371Z\"/> \u003c/svg>","c16":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 16 16\"> \u003crect width=\"16\" height=\"16\" rx=\"3.5\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M4 2L12 2A1 1 0 0 1 13 3L13 14L8 11L3 14L3 3A1 1 0 0 1 4 2ZM6 4H7V5H8H9V6H10V8H9V9H8H7V10H6Z\"/> \u003c/svg>","glyph":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"> \u003cpath fill=\"#FFFFFF\" fill-rule=\"evenodd\" d=\"M6 2L18 2A2 2 0 0 1 20 4L20 22L12 17L4 22L4 4A2 2 0 0 1 6 2ZM9.224 6.727L14.915 10.284A0.8 0.8 0 0 1 14.915 11.641L9.224 15.197A0.8 0.8 0 0 1 8 14.519L8 7.406A0.8 0.8 0 0 1 9.224 6.727Z\"/> \u003c/svg>"}},{"id":"s1","title":"Split bookmark","idea":"Shelf's bookmark cut once down its centre line, so the two halves stand as a pause sign. Each half keeps its half of the notch, and the eye closes the two slopes back into one bookmark; a pause and a bookmark both mean stop here and come back later.","built":"geom.bookmark at 42 dp wide with today's proportions, drawn as one compound path of two pieces, centred on its drawn box (reach 32.0 of the 33 dp safe radius, centroid 1.9 dp above centre). The cut is 6.3 dp, 0.15 of the width. The app's own pause button (Lucide pause filled with the 1.75 stroke: bars 5.75 wide, gap 2.25) has a gap of 0.164 of its width; a hair narrower here lets the bookmark lead, and from 0.18 up the halves start to read as two separate bars. Each half runs from its tip up its half of the notch to the cut, so the slope is unbroken. The four corners the cut makes take the tip radius (1.5/34 of the width) and only the outer shoulders are round, so the halves read as one shape cut through.","small":"Nothing is dropped at any size. 48 px: 28 x 34 px, 4 px cut, shoulders r 3, each notch edge from the tip at (10, 41) to the cut at (22, 33), a 2:3 slope close to the master's. 32 px: 20 x 24 px with a 4 px cut, since a 2 px cut went faint where this size shows at 16 CSS px on 2x screens; notch 5 over 8. 16 px: 10 x 12 px, 2 px cut, notch 3 over 4, shoulders r 1. I tried 1:2 slopes at 48 and 32: cleaner steps, but visibly flatter than the master's notch and no fewer grey pixels. Glyph: 16 x 20 px with a 2 px cut, the master's proportion, because phones draw it at 2.6 times or more.","risks":"It reads as a pause sign, and as listening only to someone who already knows Shelf reads articles aloud; pause on its own says something is playing now. Out of context, most of all at 16 px, it can pass for a media app's pause button before it reads as a bookmark; the angled feet keep it Shelf's. Near lookalikes: a Roman numeral II, a parallel sign. The gap carries the whole idea, so every later redraw has to keep it open.","notes":{},"svg":{"mark":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 108 108\"> \u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M37.941 28.835L48.997 28.835A1.853 1.853 0 0 1 50.85 30.688L50.85 68.16A1.853 1.853 0 0 1 50.004 69.715L35.86 78.867A1.853 1.853 0 0 1 33 77.312L33 33.777A4.941 4.941 0 0 1 37.941 28.835ZM59.003 28.835L70.059 28.835A4.941 4.941 0 0 1 75 33.777L75 77.312A1.853 1.853 0 0 1 72.14 78.867L57.996 69.715A1.853 1.853 0 0 1 57.15 68.16L57.15 30.688A1.853 1.853 0 0 1 59.003 28.835Z\"/> \u003c/svg>","c48":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\"> \u003crect width=\"48\" height=\"48\" rx=\"10.5\" fill=\"#111112\"/> \u003cpath fill=\"#F3F2EE\" d=\"M13 7L22 7L22 33L10 41L10 10A3 3 0 0 1 13 7ZM26 7L35 7A3 3 0 0 1 38 10L38 41L26 33L26 7Z\"/> \u003c/svg>","c32":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 32 32\"> \u003crect width=\"32\" height=\"32\" rx=\"7\" fill=\"#111112\"/> \u003cpath fill=\"#F3F2EE\" d=\"M8 4L14 4L14 23L6 28L6 6A2 2 0 0 1 8 4ZM18 4L24 4A2 2 0 0 1 26 6L26 28L18 23L18 4Z\"/> \u003c/svg>","c16":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 16 16\"> \u003crect width=\"16\" height=\"16\" rx=\"3.5\" fill=\"#111112\"/> \u003cpath fill=\"#F3F2EE\" d=\"M4 2L7 2L7 11L3 14L3 3A1 1 0 0 1 4 2ZM9 2L12 2A1 1 0 0 1 13 3L13 14L9 11L9 2Z\"/> \u003c/svg>","glyph":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"> \u003cpath fill=\"#FFFFFF\" d=\"M6 2L11 2L11 17L4 22L4 4A2 2 0 0 1 6 2ZM13 2L18 2A2 2 0 0 1 20 4L20 22L13 17L13 2Z\"/> \u003c/svg>"}},{"id":"n3","title":"One hand","idea":"The play hole is cut at the notch's own angle, its two sides parallel to the notch's two diagonals, so tail and triangle look cut by one hand, and it is as large as the bookmark can hold. That leaves room for a full-height pause in an even dark ring, and one module sets every wall, bar and gap, so the pause survives down to 32 px.","built":"Same bookmark (43.5 dp wide, top at 27.1, reach 32.6 dp). The play's sides slope at the notch's 11 in 17 (32.9 degrees from level, 65.8 at the tip), so it is 44.6 dp tall and 34.5 deep, corners at the shoulder radius. One module, 4.1 dp (9.4% of the bookmark's width), sets the paper band over the notch, which runs parallel to it, the top wall, both pause bars, the gap between them and the dark ring round them. The left wall, 6.8 dp, is the one measure off the module, chosen so the drawn tip sits 6.5 dp from the right edge and the play is optically centred. The bars come out at 4.1 x 14.6 dp, about 1 to 3.5, the proportion of a standard pause sign. The left bar is a module from the flat side and the right bar's corners a module from the slanted sides, so the ring is even on all three sides and the pause sits in the deep part of the play, 1.9 dp left of the incircle centre.","small":"The module is 3 px on the 48 px cut and 2 px on the 32, so both keep the pause. 48 px: bookmark 32 x 40 px, a 33 px play and 3 x 9 px bars, with the notch and the play's sides at 2:3 so they stay parallel on the pixel grid. 32 px: bookmark 22 x 27 px, a 23 px play and 2 x 6 px bars. Every bar sits on whole pixels. To make room, these two bookmarks fill about two thirds of the tile, against the master's 60%. 16 px drops the pause, since a 1 px module blurs into one grey patch, and shares n1's 4 x 7 px stepped play. Glyph 24: bookmark 16 x 20 px with a 15 px play hole and 2 px walls; no pause, as a 2 px pause does not fit.","risks":"The hole is so large that the bookmark becomes a frame, and at a glance the play can register before the bookmark; that also puts it closest of the three to Google Play Books. The walls are 4.1 dp, under 3 px on a 1x home screen, so the frame looks light beside solid icons. The small cuts are drawn larger in their tiles than the master, so in the toolbar the icon looks a size up from the launcher's proportions.","notes":{},"svg":{"mark":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 108 108\"> \u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M37.368 27.1L70.632 27.1A5.118 5.118 0 0 1 75.75 32.218L75.75 77.308A1.919 1.919 0 0 1 72.788 78.919L54 66.762L35.212 78.919A1.919 1.919 0 0 1 32.25 77.308L32.25 32.218A5.118 5.118 0 0 1 37.368 27.1ZM46.948 32.021L66.905 44.935A5.118 5.118 0 0 1 66.905 53.528L46.948 66.441A5.118 5.118 0 0 1 39.05 62.145L39.05 36.318A5.118 5.118 0 0 1 46.948 32.021ZM44.15 41.95L46.25 41.95A1 1 0 0 1 47.25 42.95L47.25 55.513A1 1 0 0 1 46.25 56.513L44.15 56.513A1 1 0 0 1 43.15 55.513L43.15 42.95A1 1 0 0 1 44.15 41.95ZM52.35 41.95L54.45 41.95A1 1 0 0 1 55.45 42.95L55.45 55.513A1 1 0 0 1 54.45 56.513L52.35 56.513A1 1 0 0 1 51.35 55.513L51.35 42.95A1 1 0 0 1 52.35 41.95Z\"/> \u003c/svg>","c48":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\"> \u003crect width=\"48\" height=\"48\" rx=\"10.5\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M11.5 4L36.5 4A3.5 3.5 0 0 1 40 7.5L40 44L24 33.333L8 44L8 7.5A3.5 3.5 0 0 1 11.5 4ZM18.441 7.588L33.457 17.598A3.5 3.5 0 0 1 33.457 23.423L18.441 33.433A3.5 3.5 0 0 1 13 30.521L13 10.5A3.5 3.5 0 0 1 18.441 7.588ZM16 16L19 16L19 25L16 25L16 16ZM22 16L25 16L25 25L22 25L22 16Z\"/> \u003c/svg>","c32":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 32 32\"> \u003crect width=\"32\" height=\"32\" rx=\"7\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M7.5 3L24.5 3A2.5 2.5 0 0 1 27 5.5L27 30L16 22.667L5 30L5 5.5A2.5 2.5 0 0 1 7.5 3ZM11.887 5.42L21.956 12.132A2.5 2.5 0 0 1 21.956 16.293L11.887 23.005A2.5 2.5 0 0 1 8 20.925L8 7.5A2.5 2.5 0 0 1 11.887 5.42ZM10 11L12 11L12 17L10 17L10 11ZM14 11L16 11L16 17L14 17L14 11Z\"/> \u003c/svg>","c16":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 16 16\"> \u003crect width=\"16\" height=\"16\" rx=\"3.5\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M4 2L12 2A1 1 0 0 1 13 3L13 14L8 11L3 14L3 3A1 1 0 0 1 4 2ZM6 4H7V5H8V6H9V7H10V8H9V9H8V10H7V11H6Z\"/> \u003c/svg>","glyph":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"> \u003cpath fill=\"#FFFFFF\" fill-rule=\"evenodd\" d=\"M6 2L18 2A2 2 0 0 1 20 4L20 22L12 16.667L4 22L4 4A2 2 0 0 1 6 2ZM9.332 4.252L16.302 8.899A1.5 1.5 0 0 1 16.302 11.395L9.332 16.042A1.5 1.5 0 0 1 7 14.794L7 5.5A1.5 1.5 0 0 1 9.332 4.252Z\"/> \u003c/svg>"}},{"id":"p1","title":"Centred play","idea":"Shelf's bookmark in solid paper with one hole: an equilateral play, rounded as softly as the bookmark's shoulders and set in the middle of the body, so the paper around it reads as an even frame. The bookmark reads first, and the hole says every save can be played.","built":"Bookmark 42.5 dp wide, 1.25 times today's with its proportions unchanged, drawn box centred on the canvas; the farthest ink is 32.4 dp from the centre. In bookmark units (34 wide): the play is 22 tall and 19.05 deep (equilateral), half the bookmark's height. Corners r 2.5 units (3.1 dp): on a 60 degree corner that reads as soft as the 4 unit shoulders on their 90. The flat side sits 0.42 of the play's depth left of the centre line, between box centring (0.5) and centroid centring (0.33), leaving 9 units of paper at the flat side and 8.45 at the rounded tip, which look equal. The play's axis is 17.25 units below the top: 8.1 units of paper above the hole and 6.4 to the notch's apex, which balances because the apex is a point. The hole is 16% of the bookmark's area.","small":"48 px: bookmark 28 x 34 px with a 9 px notch; the play 18 x 16 px with its flat side on x 17, 7 px of paper at the flat side and at the tip, 6.5 px above and 5.2 to the apex. 32 px: bookmark 18 x 22, play 11 x 9.5 px on x 12, walls of 5 and 4.9 px, 4.5 above and 3.3 to the apex. 16 px: bookmark 10 x 12; the play is redrawn in whole pixels as columns of 5, 3, 3 and 1 on x 6, rows 4 to 8, floating with 2 px of paper above and 2 to 3 below, since a drawn triangle this small is only grey pixels. Glyph: bookmark 16 x 20, play 10 px tall on x 8 with 4 px walls. Every cut keeps the play; nothing is dropped.","risks":"Google Play Books pairs the same two symbols, a soft play triangle holding a bookmark. Here the silhouette is Shelf's square-shouldered bookmark and the play is a hole, which keeps them apart, but a bigger or softer play would close the gap. After the silhouette, the play is the loudest thing on the icon, so among media apps it could be taken for a player. At 16 px the play is 5 px tall and only just reads as a play.","notes":{},"svg":{"mark":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 108 108\"> \u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M37.75 28.536L70.25 28.536A5 5 0 0 1 75.25 33.536L75.25 77.589A1.875 1.875 0 0 1 72.356 79.164L54 67.286L35.644 79.164A1.875 1.875 0 0 1 32.75 77.589L32.75 33.536A5 5 0 0 1 37.75 28.536ZM48.685 39.055L63.125 47.392A3.125 3.125 0 0 1 63.125 52.805L48.685 61.142A3.125 3.125 0 0 1 43.998 58.436L43.998 41.761A3.125 3.125 0 0 1 48.685 39.055Z\"/> \u003c/svg>","c48":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\"> \u003crect width=\"48\" height=\"48\" rx=\"10.5\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M13 7L35 7A3 3 0 0 1 38 10L38 41L24 32L10 41L10 10A3 3 0 0 1 13 7ZM19.981 13.677L29.901 19.257A2 2 0 0 1 29.901 22.743L19.981 28.323A2 2 0 0 1 17 26.58L17 15.42A2 2 0 0 1 19.981 13.677Z\"/> \u003c/svg>","c32":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 32 32\"> \u003crect width=\"32\" height=\"32\" rx=\"7\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M9 5L23 5A2 2 0 0 1 25 7L25 27L16 21L7 27L7 7A2 2 0 0 1 9 5ZM14.101 9.717L19.407 12.788A1.4 1.4 0 0 1 19.407 15.212L14.101 18.283A1.4 1.4 0 0 1 12 17.072L12 10.928A1.4 1.4 0 0 1 14.101 9.717Z\"/> \u003c/svg>","c16":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 16 16\"> \u003crect width=\"16\" height=\"16\" rx=\"3.5\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M4 2L12 2A1 1 0 0 1 13 3L13 14L8 11L3 14L3 3A1 1 0 0 1 4 2ZM6 4H7V5H8H9V6H10V7H9V8H8H7V9H6Z\"/> \u003c/svg>","glyph":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"> \u003cpath fill=\"#FFFFFF\" fill-rule=\"evenodd\" d=\"M6 2L18 2A2 2 0 0 1 20 4L20 22L12 17L4 22L4 4A2 2 0 0 1 6 2ZM9.773 5.964L15.26 8.946A1.2 1.2 0 0 1 15.26 11.054L9.773 14.036A1.2 1.2 0 0 1 8 12.982L8 7.018A1.2 1.2 0 0 1 9.773 5.964Z\"/> \u003c/svg>"}},{"id":"h1","title":"The tail plays","idea":"Shelf's bookmark with one straight cut that carries the notch's right edge on through the apex to the left side; the paper under the cut, the bookmark's own left tail, is a play triangle. The notch is cut at the same angle as the app's play button (32.9 degrees against Lucide's 32.7), so the play was already inside the bookmark and the outline stays whole.","built":"Today's bookmark at 42 dp wide, scale 42/34: notch 13.59, shoulders r 4.94, tips r 1.85, no proportion changed; drawn box centred like the reference, reach 32.06 of 33. The line through the right tip and the apex, carried on, meets the left edge two notches above the tips (y 53.5) and is the body's whole lower edge. The play's top edge is that line moved 3.2 dp down, square to it; its bottom edge is the notch's own left flank, so the two are mirror images and the play is isosceles, 23.4 tall and 18.1 deep (0.77; the app's play is 0.78), its tip about 3 dp short of the apex. Its corners take the tail tips' radius, r 1.85, since one of them is a tail tip. The cut opens to the left edge at one end and into the notch at the other, so there is no hole and the outline is exactly the reference bookmark's.","small":"48 px: everything, bookmark 28 x 34 px, notch 9 (slope 9/14); the cut drops 4 px (3.4 square to the line) so its ends land on whole pixels; play 14 x 10.9 px. 32 px: everything, 18 x 22, notch 6, cut 3 px (2.5 square), play 9 x 6.75. 16 px: redrawn in whole pixels, 10 x 12; the line and the notch become 45 degree stairs, as the brand's own 16 px cut does with its notch, the cut a 2 px step and the play 6, 4 and 2 px tall in three columns (2.2% soft pixels against the reference's 14.7). Glyph: 16 x 20 inside the padding, cut 3 px (2.5 square), play 7 x 5.6.","risks":"A diagonal through a bookmark can read as a slash, the convention for 'bookmark off'; here it runs only through the tail and the play under it gives it a reason, but it is the main risk. It can also read as a page with a folded corner and a play, a media-file icon. Google Play Books also pairs a bookmark with a play (a rounded play triangle with a bookmark inside); here the bookmark is the outline and the play a quarter of it. The play is paper, where Richard described a dark play: the dark here is the cut and the notch. At 16 px the play is a six-pixel hint.","notes":{"judges":{"Blind read":"Ranked last: the diagonal reads as a slash through a box, the mark for off or muted."}},"svg":{"mark":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 108 108\"> \u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M37.941 28.837L70.059 28.837A4.941 4.941 0 0 1 75 33.778L75 77.313A1.853 1.853 0 0 1 72.14 78.869L33.846 54.091A1.853 1.853 0 0 1 33 52.535L33 33.778A4.941 4.941 0 0 1 37.941 28.837ZM35.86 59.205L48.651 67.481A1.853 1.853 0 0 1 48.651 70.593L35.86 78.869A1.853 1.853 0 0 1 33 77.313L33 60.76A1.853 1.853 0 0 1 35.86 59.205Z\"/> \u003c/svg>","c48":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\"> \u003crect width=\"48\" height=\"48\" rx=\"10.5\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M13 7L35 7A3 3 0 0 1 38 10L38 39.168A1 1 0 0 1 36.459 40.01L10.459 23.295A1 1 0 0 1 10 22.454L10 10A3 3 0 0 1 13 7ZM11.541 27.99L19.58 33.159A1 1 0 0 1 19.58 34.841L11.541 40.01A1 1 0 0 1 10 39.168L10 28.832A1 1 0 0 1 11.541 27.99Z\"/> \u003c/svg>","c32":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 32 32\"> \u003crect width=\"32\" height=\"32\" rx=\"7\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M9 5L23 5A2 2 0 0 1 25 7L25 25.599A0.75 0.75 0 0 1 23.834 26.223L7.334 15.223A0.75 0.75 0 0 1 7 14.599L7 7A2 2 0 0 1 9 5ZM8.166 18.777L12.814 21.876A0.75 0.75 0 0 1 12.814 23.124L8.166 26.223A0.75 0.75 0 0 1 7 25.599L7 19.401A0.75 0.75 0 0 1 8.166 18.777Z\"/> \u003c/svg>","c16":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 16 16\"> \u003crect width=\"16\" height=\"16\" rx=\"3.5\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M3 3A1 1 0 0 1 4 2H12A1 1 0 0 1 13 3V14H12V13H11V12H10V11H9V10H7V9H6V8H5V7H4V6H3ZM3 8H4V9H5V10H6V12H5V13H4V14H3Z\"/> \u003c/svg>","glyph":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"> \u003cpath fill=\"#FFFFFF\" fill-rule=\"evenodd\" d=\"M6 2L18 2A2 2 0 0 1 20 4L20 21.098A0.5 0.5 0 0 1 19.235 21.522L4.235 12.147A0.5 0.5 0 0 1 4 11.723L4 4A2 2 0 0 1 6 2ZM4.765 15.478L8.922 18.076A0.5 0.5 0 0 1 8.922 18.924L4.765 21.522A0.5 0.5 0 0 1 4 21.098L4 15.902A0.5 0.5 0 0 1 4.765 15.478Z\"/> \u003c/svg>"}},{"id":"n2","title":"Bookmark window","idea":"The bookmark first: a smaller play hole set in Shelf's bookmark like a window, with a broad margin of paper al
