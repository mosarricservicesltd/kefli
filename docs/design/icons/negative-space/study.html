l round and the paper pause held snugly inside it. Of the three it keeps the most solid bookmark, so saving reads before listening.","built":"Same bookmark as n1 (43.5 dp wide, top at 27.1, reach 32.6 dp). The play is equilateral, 32.3 dp tall, corners at the shoulder radius, sized so at least 7.5 dp of paper stays round it: 7.5 over the notch, 9 at the top corner, 10.4 on the left and 10.2 past the drawn tip. The band over the notch is the thinnest on purpose, because the tails add paper either side of it. The play's centroid is at (52, 48.5), on the bookmark's visual centre, which sits lower than the middle of the body above the notch; centred on the body, the play looked high. The pause sits on the incircle (radius 9.3 dp): bars 3.3 x 10 dp, 2.8 dp apart, inside a 3 dp ring, tighter than n1's 4 dp, so the island keeps its size in the smaller play.","small":"48 px: bookmark 28 x 34 px with a 20 px play and 4.8 to 7 px of paper round it; no pause, as the play's incircle is under 6 px in radius. 32 px: a 14 px play with 3.4 to 5 px of paper; no pause. 16 px: the same 4 x 7 px stepped play as n1. Glyph 24: an 11 px play hole with at least 3.3 px of white round it; no pause. In the 48, the 32 and the glyph the play's ends sit on half pixels so the paper above and below it keeps the master's ratio; the play has no level edge, so nothing blurs.","risks":"The quietest of the three, and the nearest to a bookmark with a play badge placed on it, the clip-art reading the brief warns against. Its pause is the smallest here and turns to specks on a 1x home screen, and its play window is small in the 32 and 16 px cuts. It shares n1's likeness to Google Play Books, at a lower volume.","notes":{},"svg":{"mark":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 108 108\"> \u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M37.368 27.1L70.632 27.1A5.118 5.118 0 0 1 75.75 32.218L75.75 77.308A1.919 1.919 0 0 1 72.788 78.919L54 66.762L35.212 78.919A1.919 1.919 0 0 1 32.25 77.308L32.25 32.218A5.118 5.118 0 0 1 37.368 27.1ZM50.36 36.796L62.956 44.068A5.118 5.118 0 0 1 62.956 52.932L50.36 60.204A5.118 5.118 0 0 1 42.684 55.772L42.684 41.228A5.118 5.118 0 0 1 50.36 36.796ZM48.297 43.499L49.597 43.499A1 1 0 0 1 50.597 44.499L50.597 52.501A1 1 0 0 1 49.597 53.501L48.297 53.501A1 1 0 0 1 47.297 52.501L47.297 44.499A1 1 0 0 1 48.297 43.499ZM54.403 43.499L55.703 43.499A1 1 0 0 1 56.703 44.499L56.703 52.501A1 1 0 0 1 55.703 53.501L54.403 53.501A1 1 0 0 1 53.403 52.501L53.403 44.499A1 1 0 0 1 54.403 43.499Z\"/> \u003c/svg>","c48":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\"> \u003crect width=\"48\" height=\"48\" rx=\"10.5\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M13 7L35 7A3 3 0 0 1 38 10L38 41L24 32L10 41L10 10A3 3 0 0 1 13 7ZM21.488 13.065L29.942 17.895A3 3 0 0 1 29.942 23.105L21.488 27.935A3 3 0 0 1 17 25.33L17 15.67A3 3 0 0 1 21.488 13.065Z\"/> \u003c/svg>","c32":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 32 32\"> \u003crect width=\"32\" height=\"32\" rx=\"7\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M8 4L24 4A2 2 0 0 1 26 6L26 28L16 21.5L6 28L6 6A2 2 0 0 1 8 4ZM13.992 8.21L20.211 11.764A2 2 0 0 1 20.211 15.236L13.992 18.79A2 2 0 0 1 11 17.054L11 9.946A2 2 0 0 1 13.992 8.21Z\"/> \u003c/svg>","c16":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 16 16\"> \u003crect width=\"16\" height=\"16\" rx=\"3.5\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M4 2L12 2A1 1 0 0 1 13 3L13 14L8 11L3 14L3 3A1 1 0 0 1 4 2ZM6 4H7V5H8V6H9V7H10V8H9V9H8V10H7V11H6Z\"/> \u003c/svg>","glyph":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"> \u003cpath fill=\"#FFFFFF\" fill-rule=\"evenodd\" d=\"M6 2L18 2A2 2 0 0 1 20 4L20 22L12 17L4 22L4 4A2 2 0 0 1 6 2ZM10.246 5.787L15.328 8.698A1.5 1.5 0 0 1 15.328 11.302L10.246 14.213A1.5 1.5 0 0 1 8 12.912L8 7.088A1.5 1.5 0 0 1 10.246 5.787Z\"/> \u003c/svg>"}},{"id":"p3","title":"Quiet play","idea":"The bookmark stays the hero, with the app's own play button punched small through its optical centre. The icon says saved first and listen second.","built":"Bookmark as p1: 42.5 dp wide, today's proportions, drawn box centred. The play has the proportions of the player's Lucide play (14 deep by 18 tall); its flat side is 15 units of 34 (18.75 dp), 36% of the bookmark's height, the smallest play a 48 px icon still shows without effort. Corners r 1.7 units, 0.11 of its height, the same softness as p1's play. The flat side sits 0.40 of the depth left of the centre line, close to centroid centring, because the eye places a small shape in a wide field by its mass. The axis is 17.6 units below the top: the centre of mass is at 18.4, but a small play there reads low. Walls: 12.3 units at the flat side, 11.4 at the tip, 11.5 above and 7.8 to the notch's apex. The hole is 6.6% of the bookmark.","small":"48 px: play 12 x 9.3 px on x 20, 10 px of paper at the flat side and 9.9 at the tip. 32 px: play 8.5 x 6.6 px on x 13, walls of 6 and 6.2 px. 16 px: the play in whole pixels as columns of 5, 3 and 1 on x 7, rows 5 to 9, the smallest shape that still reads as a play. Glyph: play 8.5 px tall on x 9, walls of 5 and 5.2 px. Every cut keeps the play; at 16 px it is as tall as p1's, as nothing smaller reads as a play.","risks":"The least inventive of the three: a symbol set into the bookmark, close to clip art, kept clear of it only by its restraint. The play is small, so in the status bar and at 16 px it is a 5 px mark that can be taken for a speck, and on a busy home screen the listen message is easy to miss. It shares its play shape with p2.","notes":{},"svg":{"mark":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 108 108\"> \u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M37.75 28.536L70.25 28.536A5 5 0 0 1 75.25 33.536L75.25 77.589A1.875 1.875 0 0 1 72.356 79.164L54 67.286L35.644 79.164A1.875 1.875 0 0 1 32.75 77.589L32.75 33.536A5 5 0 0 1 37.75 28.536ZM51.441 43.266L59.969 48.748A2.125 2.125 0 0 1 59.969 52.324L51.441 57.806A2.125 2.125 0 0 1 48.167 56.019L48.167 45.053A2.125 2.125 0 0 1 51.441 43.266Z\"/> \u003c/svg>","c48":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\"> \u003crect width=\"48\" height=\"48\" rx=\"10.5\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M13 7L35 7A3 3 0 0 1 38 10L38 41L24 32L10 41L10 10A3 3 0 0 1 13 7ZM22.157 16.887L27.499 20.322A1.4 1.4 0 0 1 27.499 22.678L22.157 26.113A1.4 1.4 0 0 1 20 24.935L20 18.065A1.4 1.4 0 0 1 22.157 16.887Z\"/> \u003c/svg>","c32":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 32 32\"> \u003crect width=\"32\" height=\"32\" rx=\"7\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M9 5L23 5A2 2 0 0 1 25 7L25 27L16 21L7 27L7 7A2 2 0 0 1 9 5ZM14.387 10.893L18.425 13.493A0.9 0.9 0 0 1 18.425 15.007L14.387 17.607A0.9 0.9 0 0 1 13 16.85L13 11.65A0.9 0.9 0 0 1 14.387 10.893Z\"/> \u003c/svg>","c16":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 16 16\"> \u003crect width=\"16\" height=\"16\" rx=\"3.5\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M4 2L12 2A1 1 0 0 1 13 3L13 14L8 11L3 14L3 3A1 1 0 0 1 4 2ZM7 5H8V6H9V7H10V8H9V9H8V10H7Z\"/> \u003c/svg>","glyph":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"> \u003cpath fill=\"#FFFFFF\" fill-rule=\"evenodd\" d=\"M6 2L18 2A2 2 0 0 1 20 4L20 22L12 17L4 22L4 4A2 2 0 0 1 6 2ZM10.387 7.393L14.425 9.993A0.9 0.9 0 0 1 14.425 11.507L10.387 14.107A0.9 0.9 0 0 1 9 13.35L9 8.15A0.9 0.9 0 0 1 10.387 7.393Z\"/> \u003c/svg>"}},{"id":"s3","title":"Notch-echo pause","idea":"A solid Shelf bookmark with a pause cut out of its body. The two holes together are the bookmark's own outline, inset and cut down the middle, so the pause stands on the tail's angle and the paper under it is an even chevron.","built":"The 42 dp bookmark as in s1. Two holes 8 dp wide with a 4 dp spine between them (half a hole, as tight as the app's own pause button). Paper: 11 dp at the sides, 10.5 above, and 9 dp between the holes and the notch measured square to the notch edge, so the chevron band is even along its length. The holes sit wholly above the notch's apex, and their corners take the tip radius. With 9 dp walls the paper turned into a frame, close to the outlined bookmark that means not saved in most interfaces; with 12 dp walls the holes started to look like a pair of eyes.","small":"Nothing is dropped. 48 px: 28 x 34 px; holes 5 px wide, a 4 px spine and 7 px walls, the holes' bottoms 3 px lower at the outside edge (the echo). 32 px: 20 x 24 px; holes 4 px, spine 2, walls 5, a 2 px echo. 16 px: 10 x 12 px; holes, spine and walls 2 px each, with flat bottoms, since a one-pixel slant only adds grey. Glyph: 16 x 20 px; holes 4 px, spine 2, side walls 3, top 4, a 2 px echo.","risks":"The most literal of the three: a pause stamped into a bookmark, the same construction as Google Play Books (a media symbol inside a bookmark-like shape) with pause in place of play. It reads as a pause sign, and as listening only to someone who knows Shelf reads aloud. The echo is quiet at 48 px and gone at 16. Two dark slots in a light shape can read as eyes; the narrow spine and the holes' height hold it to a pause.","notes":{},"svg":{"mark":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 108 108\"> \u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M37.941 28.835L70.059 28.835A4.941 4.941 0 0 1 75 33.777L75 77.312A1.853 1.853 0 0 1 72.14 78.867L54 67.129L35.86 78.867A1.853 1.853 0 0 1 33 77.312L33 33.777A4.941 4.941 0 0 1 37.941 28.835ZM45.853 39.335L50.147 39.335A1.853 1.853 0 0 1 52 41.188L52 56.696A1.853 1.853 0 0 1 51.154 58.251L46.86 61.03A1.853 1.853 0 0 1 44 59.474L44 41.188A1.853 1.853 0 0 1 45.853 39.335ZM57.853 39.335L62.147 39.335A1.853 1.853 0 0 1 64 41.188L64 59.474A1.853 1.853 0 0 1 61.14 61.03L56.846 58.251A1.853 1.853 0 0 1 56 56.696L56 41.188A1.853 1.853 0 0 1 57.853 39.335Z\"/> \u003c/svg>","c48":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\"> \u003crect width=\"48\" height=\"48\" rx=\"10.5\" fill=\"#111112\"/> \u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M13 7L35 7A3 3 0 0 1 38 10L38 41L24 32L10 41L10 10A3 3 0 0 1 13 7ZM17 14L22 14L22 26L17 29L17 14ZM26 14L31 14L31 29L26 26L26 14Z\"/> \u003c/svg>","c32":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 32 32\"> \u003crect width=\"32\" height=\"32\" rx=\"7\" fill=\"#111112\"/> \u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M8 4L24 4A2 2 0 0 1 26 6L26 28L16 22L6 28L6 6A2 2 0 0 1 8 4ZM11 9L15 9L15 18L11 20L11 9ZM17 9L21 9L21 20L17 18L17 9Z\"/> \u003c/svg>","c16":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 16 16\"> \u003crect width=\"16\" height=\"16\" rx=\"3.5\" fill=\"#111112\"/> \u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M4 2L12 2A1 1 0 0 1 13 3L13 14L8 11L3 14L3 3A1 1 0 0 1 4 2ZM5 4L7 4L7 9L5 9L5 4ZM9 4L11 4L11 9L9 9L9 4Z\"/> \u003c/svg>","glyph":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"> \u003cpath fill=\"#FFFFFF\" fill-rule=\"evenodd\" d=\"M6 2L18 2A2 2 0 0 1 20 4L20 22L12 17L4 22L4 4A2 2 0 0 1 6 2ZM7 6L11 6L11 15L7 17L7 6ZM13 6L17 6L17 17L13 15L13 6Z\"/> \u003c/svg>"}},{"id":"s2","title":"Forked tail","idea":"Shelf's bookmark with its notch carried up the centre line as a slot, so the tail forks into two legs under a whole head. It was meant to be a bookmark and a pause at once; drawn, it reads as a bookmark with a split tail, and the pause does not come through.","built":"The same 42 dp bookmark and 6.3 dp cut as s1 (0.15 of the width), stopped 0.4 of the height below the top edge: the slot rises 17.5 dp above the notch's apex, and its corners take the tip radius. I drew heads of 0.45, 0.4, 0.33, 0.3, 0.24, 0.16 and 0.1 of the height, slots from 0.1 to 0.22 of the width, and square, round and pointed slot ends. From about 0.33 down the shape reads as a Π, a gate or a pair of trousers, so 0.4 is the deepest that is still plainly the bookmark.","small":"Nothing is dropped. 48 px: 28 x 34 px, a 4 px slot from the notch up to y 21, leaving 14 px of head. 32 px: 20 x 24 px, 4 px slot up to y 14. 16 px: 10 x 12 px, 2 px slot up to y 7. Glyph: 16 x 20 px, 2 px slot up to y 10. The head is about 0.4 of the height at every size, and the notch edges use s1's slopes.","risks":"It reads as neither a pause nor listening. Any bridge across the top, however thin, joins the legs into one letter-like object (Π, a gate, trousers), and Shelf's bookmark is too short for its legs to pass as pause bars: cut all the way through, each half is about 2.8 times as tall as it is wide, and every bit of head left on makes the legs stubbier. The dark slot and notch together can look like an upside-down Y, a crack or a rocket's fins. It answers how deep the slot can go; I would not put it forward on its own.","notes":{},"svg":{"mark":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 108 108\"> \u003cpath fill=\"#F3F2EE\" d=\"M37.941 28.835L70.059 28.835A4.941 4.941 0 0 1 75 33.777L75 77.312A1.853 1.853 0 0 1 72.14 78.867L57.996 69.715A1.853 1.853 0 0 1 57.15 68.16L57.15 51.441A1.853 1.853 0 0 0 55.297 49.588L52.703 49.588A1.853 1.853 0 0 0 50.85 51.441L50.85 68.16A1.853 1.853 0 0 1 50.004 69.715L35.86 78.867A1.853 1.853 0 0 1 33 77.312L33 33.777A4.941 4.941 0 0 1 37.941 28.835Z\"/> \u003c/svg>","c48":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\"> \u003crect width=\"48\" height=\"48\" rx=\"10.5\" fill=\"#111112\"/> \u003cpath fill=\"#F3F2EE\" d=\"M13 7L35 7A3 3 0 0 1 38 10L38 41L26 33L26 21L22 21L22 33L10 41L10 10A3 3 0 0 1 13 7Z\"/> \u003c/svg>","c32":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 32 32\"> \u003crect width=\"32\" height=\"32\" rx=\"7\" fill=\"#111112\"/> \u003cpath fill=\"#F3F2EE\" d=\"M8 4L24 4A2 2 0 0 1 26 6L26 28L18 23L18 14L14 14L14 23L6 28L6 6A2 2 0 0 1 8 4Z\"/> \u003c/svg>","c16":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 16 16\"> \u003crect width=\"16\" height=\"16\" rx=\"3.5\" fill=\"#111112\"/> \u003cpath fill=\"#F3F2EE\" d=\"M4 2L12 2A1 1 0 0 1 13 3L13 14L9 11L9 7L7 7L7 11L3 14L3 3A1 1 0 0 1 4 2Z\"/> \u003c/svg>","glyph":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"> \u003cpath fill=\"#FFFFFF\" d=\"M6 2L18 2A2 2 0 0 1 20 4L20 22L13 17L13 10L11 10L11 17L4 22L4 4A2 2 0 0 1 6 2Z\"/> \u003c/svg>"}},{"id":"t1","title":"The notch plays","idea":"Shelf's bookmark laid on its side, tail to the left, so the notch it already has points right as a play button. One solid shape with no holes: the play is the space the bookmark's own tail leaves open.","built":"Today's bookmark turned a quarter turn clockwise, 37 dp wide (its height on the tile) and 54.8 long. The notch is deepened from 11/34 of the width to 14/18, the proportion of Shelf's in-app play icon (Lucide play: 18 tall, 14 deep), so the notch and the player's play are the same triangle. In a depth study (0.55, 0.62, 0.70, 0.78) the dark wedge read as a chevron up to 0.62 and as a play from 0.70, most firmly at 0.78. The body behind the apex is 26 dp, 0.7 of the width. Corner radii follow the bookmark: shoulders 4/34 of the width, tips 1.5/34, and the notch's apex takes the shoulder radius (4.35 dp) so the play's point is as soft as the shoulders. Centred on y 54. Horizontally the notch takes weight from the left, so the box is moved left of centre by 0.65 of the gap between its box centre and its centroid: box-centred looked right-heavy, centroid-centred pushed the tips past the safe circle. Reach 32.6 dp, inside the 33 dp circle.","small":"Every size keeps the whole drawing, because there is nothing inside to drop. 48 px: 24 x 34 px, the notch 18 deep on a 2 : 3 staircase (the nearest clean slope to the play's 0.78), shoulders r 3, the apex r 3 (the master's 4.35 dp is 2.9 px here), sharp tips. 32 px: 16 x 23, notch 12, shoulders r 2, apex r 1. 16 px: 8 x 11, notch 6, shoulders r 1, sharp apex, 2 px clear on the left and 3 on the right. Each cut's body is the master's at that scale, so the mark sits where the master does. Glyph: 14 x 20 in the 20 px box, an 11 px notch (11/14, the play's ratio again) with its apex on a whole pixel.","risks":"On its side the bookmark loses the hang that makes it a bookmark: it can read as a tag, a label, a pennant or the tail of an arrow first, and its square shoulders are the only cue left, small at 48 px. Gmail's 'important' marker is a horizontal tag with a notched end, and Plex's chevron sits close to the notch's outline on a dark tile. A bookmark paired with a play triangle is Google Play Books' ground, which the brief flags; here the play is empty space on a sideways shape, but the pairing is the same. The play is a figure-ground switch: some people will see a chevron bite or a forward arrow until it is pointed out. The deeper notch makes the prongs long and pointed, so it is further from today's chunky bookmark than any upright option.","notes":{},"svg":{"mark":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 108 108\"> \u003cpath fill=\"#F3F2EE\" d=\"M77.268 39.853L77.268 68.147A4.353 4.353 0 0 1 72.915 72.5L28.048 72.5A1.632 1.632 0 0 1 27.165 69.495L45.572 57.662A4.353 4.353 0 0 0 45.572 50.338L27.165 38.505A1.632 1.632 0 0 1 28.048 35.5L72.915 35.5A4.353 4.353 0 0 1 77.268 39.853Z\"/> \u003c/svg>","c48":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\"> \u003crect width=\"48\" height=\"48\" rx=\"10.5\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" d=\"M40 15L40 33A3 3 0 0 1 37 36L6 36L20.256 26.496A3 3 0 0 0 20.256 21.504L6 12L37 12A3 3 0 0 1 40 15Z\"/> \u003c/svg>","c32":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 32 32\"> \u003crect width=\"32\" height=\"32\" rx=\"7\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" d=\"M27 10L27 22A2 2 0 0 1 25 24L4 24L14.752 16.832A1 1 0 0 0 14.752 15.168L4 8L25 8A2 2 0 0 1 27 10Z\"/> \u003c/svg>","c16":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 16 16\"> \u003crect width=\"16\" height=\"16\" rx=\"3.5\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" d=\"M13 5L13 11A1 1 0 0 1 12 12L2 12L8 8L2 4L12 4A1 1 0 0 1 13 5Z\"/> \u003c/svg>","glyph":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"> \u003cpath fill=\"#FFFFFF\" d=\"M22 6.5L22 17.5A1.5 1.5 0 0 1 20.5 19L2 19L11.011 13.265A1.5 1.5 0 0 0 11.011 10.735L2 5L20.5 5A1.5 1.5 0 0 1 22 6.5Z\"/> \u003c/svg>"}},{"id":"t2","title":"Play, then pause","idea":"t1's sideways bookmark with a pause cut through its body, so the notch is the play and two slots are the pause: both of Richard's symbols are negative space in one solid shape. A bookmark marks where you stopped; here its tail resumes and its body pauses.","built":"t1's bookmark exactly (37 dp wide, the notch 14/18 of the width as Shelf's in-app play icon, the same corner radii, the apex at the shoulder radius), with the body behind the apex lengthened from 26 to 29.5 dp to hold the pause. The pause is drawn like Shelf's own (Lucide's pause has bars wider than the gap between them): bars 7 x 25 dp with a 4.5 dp gap and r 1 corners. The paper round it is nearly even: 6 dp above and below the bars, 5.5 from the notch's apex to the first bar and from the last bar to the shoulders; the gap between the bars is the narrowest paper on purpose, as in any pause glyph. 58.3 dp long, centred on y 54, the box moved left of centre by half the gap between box centre and centroid. Reach 32.4 dp.","small":"48 px: 24 x 39 px, the notch 18 on a 2 : 3 staircase, bars 5 x 16 with a 3 px gap (the 48 px minimum), 4 px of paper above, below and either side of the pause. 32 px: 16 x 25, notch 12, bars 3 x 10 with a 2 px gap, 3 px above and below, 2 from the apex and 3 to the shoulders. 16 px: the pause would be 1 px slits in 1 px walls, which read as a grille at 1x, so it is dropped and the 16 px cut is t1's notch alone, the same silhouette. Glyph: 14 x 20, a 10 px notch, bars 2 x 8, 2 px apart, so it still says play and pause in the media notification.","risks":"Play beside pause is the universal media toggle, so the icon can read as a music, podcast or remote-control app before a reading app; the bookmark is only the frame round the two symbols. A bookmark paired with a play triangle is also Google Play Books' ground. The pause is cut into the body like a stamp, so it is less of a discovery than t1's notch; a quieter pause (bars 5.5 x 20) was tried and still read as play and pause, only weaker. Sideways, the bookmark can read as a tag or a label. In the status bar at 18 px the bars are about 1.5 px wide and soften.","notes":{},"svg":{"mark":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 108 108\"> \u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M81.031 39.853L81.031 68.147A4.353 4.353 0 0 1 76.678 72.5L28.311 72.5A1.632 1.632 0 0 1 27.428 69.495L45.835 57.662A4.353 4.353 0 0 0 45.835 50.338L27.428 38.505A1.632 1.632 0 0 1 28.311 35.5L76.678 35.5A4.353 4.353 0 0 1 81.031 39.853ZM58.031 41.5L63.031 41.5A1 1 0 0 1 64.031 42.5L64.031 65.5A1 1 0 0 1 63.031 66.5L58.031 66.5A1 1 0 0 1 57.031 65.5L57.031 42.5A1 1 0 0 1 58.031 41.5ZM69.531 41.5L74.531 41.5A1 1 0 0 1 75.531 42.5L75.531 65.5A1 1 0 0 1 74.531 66.5L69.531 66.5A1 1 0 0 1 68.531 65.5L68.531 42.5A1 1 0 0 1 69.531 41.5Z\"/> \u003c/svg>","c48":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\"> \u003crect width=\"48\" height=\"48\" rx=\"10.5\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M43 15L43 33A3 3 0 0 1 40 36L4 36L18.256 26.496A3 3 0 0 0 18.256 21.504L4 12L40 12A3 3 0 0 1 43 15ZM26 16L31 16L31 32L26 32L26 16ZM34 16L39 16L39 32L34 32L34 16Z\"/> \u003c/svg>","c32":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 32 32\"> \u003crect width=\"32\" height=\"32\" rx=\"7\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M28 10L28 22A2 2 0 0 1 26 24L3 24L13.752 16.832A1 1 0 0 0 13.752 15.168L3 8L26 8A2 2 0 0 1 28 10ZM17 11L20 11L20 21L17 21L17 11ZM22 11L25 11L25 21L22 21L22 11Z\"/> \u003c/svg>","c16":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 16 16\"> \u003crect width=\"16\" height=\"16\" rx=\"3.5\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M13 5L13 11A1 1 0 0 1 12 12L2 12L8 8L2 4L12 4A1 1 0 0 1 13 5Z\"/> \u003c/svg>","glyph":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"> \u003cpath fill=\"#FFFFFF\" fill-rule=\"evenodd\" d=\"M22 6.5L22 17.5A1.5 1.5 0 0 1 20.5 19L2 19L10.83 12.819A1 1 0 0 0 10.83 11.181L2 5L20.5 5A1.5 1.5 0 0 1 22 6.5ZM14 8L16 8L16 16L14 16L14 8ZM18 8L20 8L20 16L18 16L18 8Z\"/> \u003c/svg>"}},{"id":"i1","title":"Paused bookmark","idea":"A paper disc with Shelf's bookmark punched out of it and a paper pause left standing in the hole: Richard's three levels turned inside out, so the bookmark is the dark of the screen showing through the paper. A bookmark is a pause in reading, so the pause inside it says 'come back to this' and 'you can listen' at once, and on the light colourway the same drawing gives his solid light bookmark with a dark pause in it, held in an ink disc.","built":"Disc r 32 dp about the centre, reaching 32.0 of the 33 dp safe radius. Today's bookmark at today's width, 34 dp, every proportion from geom.bookmark's defaults (shoulders r 4, notch 11 deep, tips r 1.5); its box sits 0.5 dp below the disc's centre, because the notch lightens its foot and a centred box looks high. Pause bars 5.5 x 18 dp with a 5.5 dp gap and r 1.5, the tips' radius, so the drawing has only two radii; the pause is centred 17 dp below the bookmark's top edge, a little below the middle of the body above the notch, because the V under the bars reads as extra room. The narrowest paper is 5.6 dp between the tips and the disc's edge and 6.3 dp between the bars and the notch, both above the 4.5 dp that becomes 3 px at 48.","small":"48 px: disc r 21, bookmark 22 x 27 with a 7 px notch and r 3 shoulders, bars 4 x 12 with a 4 px gap; every straight edge on whole pixels, so only the disc's rim and the notch are soft (11.6%). 32 px: disc r 14, bookmark 14 x 18 with a 5 px notch, bars 2 x 8 with a 2 px gap, at least 2 px of paper everywhere. 16 px: the pause drops out; the disc is a hand-stepped 14 px circle on whole pixels and the bookmark is 6 x 9 with a 3 px notch at 45 degrees, as Shelf's own small cuts have it (6.5% soft against the solid reference's 14.7). Glyph: disc r 10 with a 10 x 12 bookmark hole and no pause, so the status bar never shows what looks like a paused control while Shelf is reading aloud.","risks":"The paper disc makes this the brightest icon on a dark home screen and moves it away from the dark icon Richard described; it is 42% paper against the solid reference's 33%. A light disc with a dark mark can read as a button, and the pause could suggest a media app at a glance, although the bookmark's square shoulders and notch read first at launcher sizes. A bookmark in a circle also echoes Telegram's Saved Messages avatar, a white bookmark on a blue disc. The pause is gone at 16 px and in the glyph, so the toolbar and the status bar show a plain bookmark disc.","notes":{},"svg":{"mark":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 108 108\"> \u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M22 54A32 32 0 1 0 86 54A32 32 0 1 0 22 54ZM41 34.2L67 34.2A4 4 0 0 1 71 38.2L71 73.443A1.5 1.5 0 0 1 68.685 74.702L54 65.2L39.315 74.702A1.5 1.5 0 0 1 37 73.443L37 38.2A4 4 0 0 1 41 34.2ZM47.25 42.2L49.75 42.2A1.5 1.5 0 0 1 51.25 43.7L51.25 58.7A1.5 1.5 0 0 1 49.75 60.2L47.25 60.2A1.5 1.5 0 0 1 45.75 58.7L45.75 43.7A1.5 1.5 0 0 1 47.25 42.2ZM58.25 42.2L60.75 42.2A1.5 1.5 0 0 1 62.25 43.7L62.25 58.7A1.5 1.5 0 0 1 60.75 60.2L58.25 60.2A1.5 1.5 0 0 1 56.75 58.7L56.75 43.7A1.5 1.5 0 0 1 58.25 42.2Z\"/> \u003c/svg>","c48":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\"> \u003crect width=\"48\" height=\"48\" rx=\"10.5\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M3 24A21 21 0 1 0 45 24A21 21 0 1 0 3 24ZM16 11L32 11A3 3 0 0 1 35 14L35 38L24 31L13 38L13 14A3 3 0 0 1 16 11ZM18 16L22 16L22 28L18 28L18 16ZM26 16L30 16L30 28L26 28L26 16Z\"/> \u003c/svg>","c32":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 32 32\"> \u003crect width=\"32\" height=\"32\" rx=\"7\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M2 16A14 14 0 1 0 30 16A14 14 0 1 0 2 16ZM11 7L21 7A2 2 0 0 1 23 9L23 25L16 20L9 25L9 9A2 2 0 0 1 11 7ZM13 10L15 10L15 18L13 18L13 10ZM17 10L19 10L19 18L17 18L17 10Z\"/> \u003c/svg>","c16":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 16 16\"> \u003crect width=\"16\" height=\"16\" rx=\"3.5\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M11 1L11 2L13 2L13 3L14 3L14 5L15 5L15 11L14 11L14 13L13 13L13 14L11 14L11 15L5 15L5 14L3 14L3 13L2 13L2 11L1 11L1 5L2 5L2 3L3 3L3 2L5 2L5 1ZM6 3L10 3A1 1 0 0 1 11 4L11 12L8 9L5 12L5 4A1 1 0 0 1 6 3Z\"/> \u003c/svg>","glyph":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"> \u003cpath fill=\"#FFFFFF\" fill-rule=\"evenodd\" d=\"M2 12A10 10 0 1 0 22 12A10 10 0 1 0 2 12ZM8.5 6L15.5 6A1.5 1.5 0 0 1 17 7.5L17 18L12 15L7 18L7 7.5A1.5 1.5 0 0 1 8.5 6Z\"/> \u003c/svg>"}},{"id":"i2","title":"Bookmarked page","idea":"A paper page with Shelf's bookmark cut out at its head, set in an even margin with the page running on below its tail, the way a ribbon lies in a book. It is the swap at its simplest, two levels with the paper standing for the page you saved; it leaves listening out on purpose to test whether the bookmark alone carries Shelf, and on paper the same drawing becomes a dark book with a light bookmark.","built":"Page 40 x 55 dp (1 : 1.375, close to A4), centred on the canvas, its corners r 3.3 dp, the bookmark's own shoulder radius, so page and bookmark share one corner language; the corners reach 32.7 of the 33 dp safe radius. Bookmark 28 dp wide with today's proportions (geom.bookmark's defaults scaled), 6 dp below the page's top edge and 6 dp in from each side, so it sits in an even margin on three sides; about 14 dp of page carries on below its tips, enough for the paper to read as a page. The narrowest paper is the 6 dp margin, above the 4.5 dp that becomes 3 px at 48.","small":"Every cut keeps both levels and every edge except the notch lies on whole pixels: 5.0%, 5.0% and 5.8% soft at 48, 32 and 16 px, against the solid reference's 3.5, 6.3 and 14.7. 48 px: page 26 x 36 with r 2, bookmark 18 x 22 with a 6 px notch, margins 4 px, 10 px of page below. 32 px: page 18 x 24 with r 1.5, bookmark 12 x 15 with a 4 px notch, margins 3 px, 6 below. 16 px: page 10 x 14 with square corners, bookmark 6 x 8 with a 3 px notch at 45 degrees, margins 2 px, 4 below. Glyph: page 14 x 20 with r 1, bookmark 10 x 12 with a 3 px notch, margins 2 px.","risks":"It is the most literal option: a page with a bookmark is a familiar 'bookmarked document' pictogram, so it relies on Shelf's square shoulders and shallow notch to be its own. It says nothing about listening. A light portrait card on a dark tile could be taken for a phone or a cards app at a glance. The page is narrower than a disc, so it looks slighter than its neighbours on a home screen (26% paper against the solid reference's 33%), and at 16 px it nearly fills the tile's height, with 1 px of tile above and below.","notes":{},"svg":{"mark":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 108 108\"> \u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M37.294 26.5L70.706 26.5A3.294 3.294 0 0 1 74 29.794L74 78.206A3.294 3.294 0 0 1 70.706 81.5L37.294 81.5A3.294 3.294 0 0 1 34 78.206L34 29.794A3.294 3.294 0 0 1 37.294 26.5ZM43.294 32.5L64.706 32.5A3.294 3.294 0 0 1 68 35.794L68 64.818A1.235 1.235 0 0 1 66.094 65.855L54 58.029L41.906 65.855A1.235 1.235 0 0 1 40 64.818L40 35.794A3.294 3.294 0 0 1 43.294 32.5Z\"/> \u003c/svg>","c48":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\"> \u003crect width=\"48\" height=\"48\" rx=\"10.5\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M13 6L35 6A2 2 0 0 1 37 8L37 40A2 2 0 0 1 35 42L13 42A2 2 0 0 1 11 40L11 8A2 2 0 0 1 13 6ZM17 10L31 10A2 2 0 0 1 33 12L33 32L24 26L15 32L15 12A2 2 0 0 1 17 10Z\"/> \u003c/svg>","c32":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 32 32\"> \u003crect width=\"32\" height=\"32\" rx=\"7\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M8.5 4L23.5 4A1.5 1.5 0 0 1 25 5.5L25 26.5A1.5 1.5 0 0 1 23.5 28L8.5 28A1.5 1.5 0 0 1 7 26.5L7 5.5A1.5 1.5 0 0 1 8.5 4ZM11.5 7L20.5 7A1.5 1.5 0 0 1 22 8.5L22 22L16 18L10 22L10 8.5A1.5 1.5 0 0 1 11.5 7Z\"/> \u003c/svg>","c16":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 16 16\"> \u003crect width=\"16\" height=\"16\" rx=\"3.5\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M3 1L13 1L13 15L3 15L3 1ZM5 3L11 3L11 11L8 8L5 11L5 3Z\"/> \u003c/svg>","glyph":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"> \u003cpath fill=\"#FFFFFF\" fill-rule=\"evenodd\" d=\"M6 2L18 2A1 1 0 0 1 19 3L19 21A1 1 0 0 1 18 22L6 22A1 1 0 0 1 5 21L5 3A1 1 0 0 1 6 2ZM8 4L16 4A1 1 0 0 1 17 5L17 16L12 13L7 16L7 5A1 1 0 0 1 8 4Z\"/> \u003c/svg>"}},{"id":"h2","title":"Two saves, one play","idea":"Two of Shelf's bookmarks, the back one exactly half a width to the right and one notch lower. At that offset the front bookmark's right flank cuts the back one's lower-left corner into a play, so the play appears where the two saves overlap and both bookmarks stay whole.","built":"Two of today's bookmarks at 31 dp wide, scale 31/34: notch 10.03, shoulders r 3.65, tips r 1.37. The back one's left side lies on the front one's centre line and its tip line one notch lower, so its apex sits under the front one's right tip and its left flank and the front's right flank close a triangle: a play 17.1 tall and 13.2 deep (0.77, like the app's play), corners r 1.37 like the tips. Gaps of 2.5 dp separate the front bookmark from the back one, beside it and under its right flank; the rest of the back one shows as a 13 dp strip. Pair box centred, reach 32.53 of 33. A version slid further right, so the back bookmark's notch showed, was drawn and dropped: its play fell to 11.6 x 8.9 dp.","small":"48 px: both bookmarks, 20 x 25 px each, notch 7 (slope 0.7), 3 px gaps; play 10 x 7.1 px. 32 px: both, 14 x 17, notch 5, 2 px gaps, play 7 x 4.9; the pair is 21 px wide, so it sits half a pixel left of centre to keep straight edges on whole pixels. 16 px: the play is dropped; the front bookmark 8 x 9 px with a 2 px stepped notch and the back one as a 3 px strip behind a 1 px gap. Glyph: both, 12 x 15, 2 px gaps, play 6 x 4.5.","risks":"Three pieces: at small sizes the back bookmark reads as a bar and the play as a symbol placed under the front bookmark rather than the corner of a second one, so the idea needs a second look. Two overlapping bookmarks is also Material's 'bookmarks' icon, a generic interface glyph. Each bookmark is smaller than in a single-bookmark mark (31 dp against 40 to 42), so it has less presence on the home screen. The 16 px cut loses the play, and the glyph is crowded at 18 px.","notes":{},"svg":{"mark":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 108 108\"> \u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M34.397 30.413L58.103 30.413A3.647 3.647 0 0 1 61.75 34.06L61.75 66.193A1.368 1.368 0 0 1 59.639 67.341L46.25 58.677L32.861 67.341A1.368 1.368 0 0 1 30.75 66.193L30.75 34.06A3.647 3.647 0 0 1 34.397 30.413ZM65.618 40.442L73.603 40.442A3.647 3.647 0 0 1 77.25 44.089L77.25 76.222A1.368 1.368 0 0 1 75.139 77.37L64.875 70.729A1.368 1.368 0 0 1 64.25 69.58L64.25 41.81A1.368 1.368 0 0 1 65.618 40.442ZM48.361 63.021L57.674 69.047A1.368 1.368 0 0 1 57.674 71.344L48.361 77.37A1.368 1.368 0 0 1 46.25 76.222L46.25 64.169A1.368 1.368 0 0 1 48.361 63.021Z\"/> \u003c/svg>","c48":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\"> \u003crect width=\"48\" height=\"48\" rx=\"10.5\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M11.5 8L26.5 8A2.5 2.5 0 0 1 29 10.5L29 31.079A1 1 0 0 1 27.427 31.899L19 26L10.573 31.899A1 1 0 0 1 9 31.079L9 10.5A2.5 2.5 0 0 1 11.5 8ZM33 15L36.5 15A2.5 2.5 0 0 1 39 17.5L39 38.079A1 1 0 0 1 37.427 38.899L32.427 35.399A1 1 0 0 1 32 34.579L32 16A1 1 0 0 1 33 15ZM20.573 31.101L24.973 34.181A1 1 0 0 1 24.973 35.819L20.573 38.899A1 1 0 0 1 19 38.079L19 31.921A1 1 0 0 1 20.573 31.101Z\"/> \u003c/svg>","c32":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 32 32\"> \u003crect width=\"32\" height=\"32\" rx=\"7\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M6.5 5L17.5 5A1.5 1.5 0 0 1 19 6.5L19 20.543A0.75 0.75 0 0 1 17.814 21.153L12 17L6.186 21.153A0.75 0.75 0 0 1 5 20.543L5 6.5A1.5 1.5 0 0 1 6.5 5ZM21.75 10L24.5 10A1.5 1.5 0 0 1 26 11.5L26 25.543A0.75 0.75 0 0 1 24.814 26.153L21.314 23.653A0.75 0.75 0 0 1 21 23.043L21 10.75A0.75 0.75 0 0 1 21.75 10ZM13.186 20.847L16.046 22.89A0.75 0.75 0 0 1 16.046 24.11L13.186 26.153A0.75 0.75 0 0 1 12 25.543L12 21.457A0.75 0.75 0 0 1 13.186 20.847Z\"/> \u003c/svg>","c16":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 16 16\"> \u003crect width=\"16\" height=\"16\" rx=\"3.5\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M3 3H9A1 1 0 0 1 10 4V12H8V11H7V10H5V11H4V12H2V4A1 1 0 0 1 3 3ZM11 5H13A1 1 0 0 1 14 6V14H12V13H11Z\"/> \u003c/svg>","glyph":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"> \u003cpath fill=\"#FFFFFF\" fill-rule=\"evenodd\" d=\"M4.5 3L13.5 3A1.5 1.5 0 0 1 15 4.5L15 17.066A0.5 0.5 0 0 1 14.223 17.482L9 14L3.777 17.482A0.5 0.5 0 0 1 3 17.066L3 4.5A1.5 1.5 0 0 1 4.5 3ZM17.5 7L19.5 7A1.5 1.5 0 0 1 21 8.5L21 21.066A0.5 0.5 0 0 1 20.223 21.482L17.223 19.482A0.5 0.5 0 0 1 17 19.066L17 7.5A0.5 0.5 0 0 1 17.5 7ZM9.777 16.518L12.876 18.584A0.5 0.5 0 0 1 12.876 19.416L9.777 21.482A0.5 0.5 0 0 1 9 21.066L9 16.934A0.5 0.5 0 0 1 9.777 16.518Z\"/> \u003c/svg>"}},{"id":"r1","title":"Ribbon with a play","idea":"Shelf's bookmark hangs from the top edge of the tile like the ribbon marker in a hardback, so the tile becomes the book and only the ribbon's body and notched tail show. A play is cut out of the body: kept for later, and ready to listen to.","built":"Ribbon 40 dp wide (the solid reference's width), running from y 0 so it passes the top of every mask and the launcher's parallax, down to tips at y 79, with Shelf's notch (11/34 of the width, 12.9 dp) and tips r 1.76; the rounded tips reach 30.2 dp from the centre. The play's slanted edges are parallel to the notch's (tan 11/17), which makes it 24 dp tall and 18.5 deep, a little slimmer than equilateral; its two back corners then share the tips' 57 degrees, and the band of paper under it runs parallel to the notch. Corners r 1.76, like the tips. It sits 0.35 of the way from box centring to centroid centring, and its height is set by the 10.5 dp band under it, which puts its centre at y 46.9: walls 11.8 left, 11.1 right (to the rounded tip) and 10.5 under, measured square to the notch.","small":"The cuts keep a lip of tile above the ribbon, 3 px at 48, 2 at 32 and 1 at 16, the smallest detail each size allows: bled to the edge, the paper merged with light browser toolbars and the tile read as a dark U. The ribbon's square top corners still say it comes from under the edge, and every cut keeps the play's rhyme with the notch. 48: ribbon 28 px, notch 9 px over a 14 px half width (Shelf's slope), play 17 px with its flat side on column 18; walls 8, 6.8 and 6.6 px. 32: ribbon 18 px, notch 6 px, play 12 px on column 12, a little larger than the master's so it holds on a 2x toolbar. 16: ribbon 8 px, notch 4 px at 45 degrees as in small.svg, play a 3 x 5 pixel staircase whose 45-degree steps match the notch, with its centroid on the centre line. Glyph: there is no tile to hang from, so it is the whole bookmark with its round shoulders, 16 px wide, with a 10 px play on column 8.","risks":"A bookmark with a play in it is close to Google Play Books. One colour, a modest hole and the ribbon running off the tile keep some distance, but this is the main risk. The bleed relies on the tile's edge being visible: on a wallpaper near graphite the ribbon's top reads as the bookmark's own, flat in the squircle and arched in the circle and teardrop; on a pale wallpaper the paper merges with the background, and the tile becomes a dark frame round a bookmark-shaped opening with the play floating in it, which still reads. The toolbar cuts need a lip of tile for the same reason, so they show the ribbon starting just under the edge. The launch screens and the website need an edge for the ribbon to hang from, such as the top of the screen; Android 12's circle-masked splash would cut it with the circle.","notes":{},"svg":{"mark":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 108 108\"> \u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M34 0L74 0L74 75.756A1.765 1.765 0 0 1 71.277 77.238L54 66.059L36.723 77.238A1.765 1.765 0 0 1 34 75.756L34 0ZM48.532 36.615L62.065 45.371A1.765 1.765 0 0 1 62.065 48.334L48.532 57.09A1.765 1.765 0 0 1 45.809 55.609L45.809 38.096A1.765 1.765 0 0 1 48.532 36.615Z\"/> \u003c/svg>","c48":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\"> \u003crect width=\"48\" height=\"48\" rx=\"10.5\" fill=\"#111112\"/> \u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M10 3L38 3L38 41L24 32L10 41ZM18 11L31.222 19.5L18 28Z\"/> \u003c/svg>","c32":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 32 32\"> \u003crect width=\"32\" height=\"32\" rx=\"7\" fill=\"#111112\"/> \u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M7 2L25 2L25 27L16 21L7 27ZM12 6L21 12L12 18Z\"/> \u003c/svg>","c16":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 16 16\"> \u003crect width=\"16\" height=\"16\" rx=\"3.5\" fill=\"#111112\"/> \u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M4 1L12 1L12 14L8 10L4 14ZM7 4L8 4L8 5L9 5L9 6L10 6L10 7L9 7L9 8L8 8L8 9L7 9Z\"/> \u003c/svg>","glyph":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"> \u003cpath fill=\"#FFFFFF\" fill-rule=\"evenodd\" d=\"M6 2L18 2A2 2 0 0 1 20 4L20 20.702A0.706 0.706 0 0 1 18.911 21.295L12 16.824L5.089 21.295A0.706 0.706 0 0 1 4 20.702L4 4A2 2 0 0 1 6 2ZM8 5L15.727 10L8 15Z\"/> \u003c/svg>"}},{"id":"r2","title":"Split ribbon","idea":"The same ribbon hanging from the top edge, split down the middle by one straight slot that runs from the edge into the notch. The slot is the only negative space: it turns one bookmark into two ribbons, like a book with two markers, and two bars side by side read as pause.","built":"Ribbon 40 dp wide from y 0 (past the top of every mask) to tips at y 79, Shelf's notch (12.9 dp), tips r 1.76; the rounded tips reach 30.2 dp from the centre. The slot is 8 dp, a fifth of the width, leaving two 16 dp bars: wide enough to read as a deliberate cut and as pause, narrow enough that the outline stays one bookmark. The notch is shared, so each bar's foot slopes from its outer tip up to the slot, meeting it at y 68.6; those inner corners stay sharp, like the notch's apex. Nothing else is cut.","small":"Nothing needs dropping. The cuts keep a lip of tile above the bars, 3 px at 48, 2 at 32 and 1 at 16, the smallest detail each size allows: bled to the edge, the paper bars merged with light browser toolbars, and the tile's sides with the dark slot between them read as a bold W. 48: ribbon 28 px, slot 6 px, bars 11 px, notch 9 px over 14. 32: ribbon 18 px, slot 4 px, bars 7 px, notch 6 px. 16: ribbon 8 px, slot 2 px, bars 3 px, notch 4 px at 45 degrees, so each foot is a clean three-step stair. The cuts' slots are about 9 dp, a touch wider than the master's 8, because a slot has to be an even number of pixels to stay centred. Glyph: the whole bookmark, 16 px wide with its outer round shoulders, split by a 4 px slot into two 6 px bars.","risks":"Two bars are the most familiar media sign there is, so at a glance it can say pause before it says bookmark; the shared notch and the bleed keep it Shelf's. Pause says stopped for now: that suits a place kept for later, but it says listen less directly than a play. On a near-white wallpaper the paper bars merge with the background and the dark frame with the slot can read as a W or a Cyrillic Ш, the same failure the toolbar cuts' lip fixes; the launcher has no such fix without giving up the bleed. On wallpapers near graphite the bar tops look flat or arched. The launch screens need an edge to hang the ribbons from.","notes":{},"svg":{"mark":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 108 108\"> \u003cpath fill=\"#F3F2EE\" d=\"M34 0L50 0L50 68.647L36.723 77.238A1.765 1.765 0 0 1 34 75.756L34 0ZM58 0L74 0L74 75.756A1.765 1.765 0 0 1 71.277 77.238L58 68.647L58 0Z\"/> \u003c/svg>","c48":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\"> \u003crect width=\"48\" height=\"48\" rx=\"10.5\" fill=\"#111112\"/> \u003cpath fill=\"#F3F2EE\" d=\"M10 3L21 3L21 33.929L10 41ZM27 3L38 3L38 41L27 33.929Z\"/> \u003c/svg>","c32":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 32 32\"> \u003crect width=\"32\" height=\"32\" rx=\"7\" fill=\"#111112\"/> \u003cpath fill=\"#F3F2EE\" d=\"M7 2L14 2L14 22.333L7 27ZM18 2L25 2L25 27L18 22.333Z\"/> \u003c/svg>","c16":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 16 16\"> \u003crect width=\"16\" height=\"16\" rx=\"3.5\" fill=\"#111112\"/> \u003cpath fill=\"#F3F2EE\" d=\"M4 1L7 1L7 10L4 13ZM9 1L12 1L12 13L9 10Z\"/> \u003c/svg>","glyph":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"> \u003cpath fill=\"#FFFFFF\" d=\"M6 2L10 2L10 18.118L4 22L4 4A2 2 0 0 1 6 2ZM14 2L18 2A2 2 0 0 1 20 4L20 22L14 18.118L14 2Z\"/> \u003c/svg>"}},{"id":"r3","title":"Ribbon, play, pause","idea":"Richard's three levels on the ribbon: the graphite tile, Shelf's bookmark hanging from its top edge in paper, a play cut out of the ribbon, and a paper pause left standing inside the play. The ribbon runs off the tile and needs no shoulders, so it can be wider than a free-standing bookmark and give the third level more room.","built":"Ribbon 46 dp wide from y 0 to tips at y 78, Shelf's notch (14.9 dp), tips r 2.03; the rounded tips reach 31.2 dp from the centre, inside the safe circle. Play 31 dp tall with its edges parallel to the notch, as in r1, corners r 2.03, placed 0.3 of the way from box to centroid centring and centred at y 45.1: walls 12.2 left, 11.5 right and 8 under. The pause is fitted by search to be as large as it can be with 2.4 dp of dark between it and the play's flat side and slanted edges: 10.2 dp tall, bars 3.3 dp, gap 2.7 dp, corners r 0.8.","small":"The pause would need bars under 3 px at 48, so every cut and the glyph drop it and keep the ribbon and the play, which is still plainly the same icon. As in r1, the cuts keep a lip of tile above the ribbon (3, 2 and 1 px) so the tile stays closed on light toolbars. 48: ribbon 30 px, notch 10 px, play 20 px on column 17. 32: ribbon 20 px, notch 7 px, play 14 px on column 12. 16: ribbon 10 px, notch 4 px, play a 4 x 7 pixel staircase. Glyph: the whole bookmark, 16 px wide, with an 11 px play.","risks":"Inside a ribbon the pause can only be 10 dp tall: it reads on a phone's launcher, turns to a smudge in the 1x home screen preview, and is gone from every smaller size, where this becomes r1 with a bigger play. A play with a pause inside is the media toggle, so of the three this leans furthest towards a media app, and it shares r1's Play Books risk. The play sits high, 10 to 11.5 dp below the top edge of the mask, because the notch and the safe circle take the bottom. The bleed's risks are as in r1.","notes":{},"svg":{"mark":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 108 108\"> \u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M31 0L77 0L77 74.27A2.029 2.029 0 0 1 73.868 75.973L54 63.118L34.132 75.973A2.029 2.029 0 0 1 31 74.27L31 0ZM46.352 31.59L64.542 43.36A2.029 2.029 0 0 1 64.542 46.768L46.352 58.537A2.029 2.029 0 0 1 43.22 56.834L43.22 33.294A2.029 2.029 0 0 1 46.352 31.59ZM46.42 39.944L48.097 39.944A0.8 0.8 0 0 1 48.897 40.744L48.897 49.384A0.8 0.8 0 0 1 48.097 50.184L46.42 50.184A0.8 0.8 0 0 1 45.62 49.384L45.62 40.744A0.8 0.8 0 0 1 46.42 39.944ZM52.36 39.944L54.036 39.944A0.8 0.8 0 0 1 54.836 40.744L54.836 49.384A0.8 0.8 0 0 1 54.036 50.184L52.36 50.184A0.8 0.8 0 0 1 51.56 49.384L51.56 40.744A0.8 0.8 0 0 1 52.36 39.944Z\"/> \u003c/svg>","c48":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\"> \u003crect width=\"48\" height=\"48\" rx=\"10.5\" fill=\"#111112\"/> \u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M9 3L39 3L39 40L24 30L9 40ZM17 8L32 18L17 28Z\"/> \u003c/svg>","c32":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 32 32\"> \u003crect width=\"32\" height=\"32\" rx=\"7\" fill=\"#111112\"/> \u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M6 2L26 2L26 27L16 20L6 27ZM12 5L22 12L12 19Z\"/> \u003c/svg>","c16":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 16 16\"> \u003crect width=\"16\" height=\"16\" rx=\"3.5\" fill=\"#111112\"/> \u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M3 1L13 1L13 14L8 10L3 14ZM6 3L7 3L7 4L8 4L8 5L9 5L9 6L10 6L10 7L9 7L9 8L8 8L8 9L7 9L7 10L6 10Z\"/> \u003c/svg>","glyph":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"> \u003cpath fill=\"#FFFFFF\" fill-rule=\"evenodd\" d=\"M6 2L18 2A2 2 0 0 1 20 4L20 20.702A0.706 0.706 0 0 1 18.911 21.295L12 16.824L5.089 21.295A0.706 0.706 0 0 1 4 20.702L4 4A2 2 0 0 1 6 2ZM8 5L16.5 10.5L8 16Z\"/> \u003c/svg>"}}],"today":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 108 108\"> \u003crect width=\"108\" height=\"108\" fill=\"#111112\"/>\u003cg transform=\"translate(54 54) scale(0.9) translate(-54 -54)\">\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M37.368 28.885L48.974 28.885A1.919 1.919 0 0 1 50.893 30.804L50.893 61.439A1.919 1.919 0 0 1 48.014 63.101L33.21 54.554A1.919 1.919 0 0 1 32.25 52.892L32.25 34.003A5.118 5.118 0 0 1 37.368 28.885ZM35.129 61.403L46.15 67.766A1.919 1.919 0 0 1 46.15 71.09L35.129 77.453A1.919 1.919 0 0 1 32.25 75.791L32.25 63.065A1.919 1.919 0 0 1 35.129 61.403ZM59.026 28.885L70.632 28.885A5.118 5.118 0 0 1 75.75 34.003L75.75 75.791A1.919 1.919 0 0 1 72.871 77.453L58.067 68.905A1.919 1.919 0 0 1 57.107 67.243L57.107 30.804A1.919 1.919 0 0 1 59.026 28.885Z\"/>\u003c/g> \u003c/svg>","cover":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 108 108\"> \u003crect width=\"108\" height=\"108\" fill=\"#111112\"/> \u003c/svg>","studies":[{"title":"D, a tad shorter","text":["Your designer friend's notes on D: a tad shorter; its height set by three play buttons, the bottom one facing right, the middle left and the top right; and the room round it that the light and themed versions have.","D's two cuts lie on the notch's two angles, so those angles already make a grid of plays up the left half, outlined in orange: the bottom one is the play with the cut above it. At the old angle three of them stood 2.6 dp taller than D, so shortening D moved it away from three plays. At 30 degrees the plays become equilateral and three of them are exactly the height, 6.5% shorter, so the two notes meet there. The notch is then 3 degrees shallower than today's bookmark.","You chose three plays, smaller, and then a bigger play for it: that is D in the options above, with its 48, 32 and 16 px cuts drawn. Every option is shown at 90%.","A reviewer with no context, shown the new D and the earlier one without names, judged the new one better drawn: its halves keep a bookmark's squat shape and it sits in the tile like the other options, where the earlier D looked a size bigger and more like a pause sign."],"pick":"D-three-90","items":[{"id":"D-was","label":"D before","note":"The first D: today's notch, 32.9 degrees, 43.5 × 53.7 dp. The play is 0.39 of the height; three plays would stand 2.6 dp above the top.","mark":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 108 108\"> \u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M37.368 27.1L48.974 27.1A1.919 1.919 0 0 1 50.893 29.019L50.893 61.224A1.919 1.919 0 0 1 47.931 62.835L33.127 53.255A1.919 1.919 0 0 1 32.25 51.644L32.25 32.218A5.118 5.118 0 0 1 37.368 27.1ZM35.212 62.006L45.79 68.851A1.919 1.919 0 0 1 45.79 72.074L35.212 78.919A1.919 1.919 0 0 1 32.25 77.308L32.25 63.618A1.919 1.919 0 0 1 35.212 62.006ZM59.026 27.1L70.632 27.1A5.118 5.118 0 0 1 75.75 32.218L75.75 77.308A1.919 1.919 0 0 1 72.788 78.919L57.984 69.339A1.919 1.919 0 0 1 57.107 67.728L57.107 29.019A1.919 1.919 0 0 1 59.026 27.1Z\"/> \u003c/svg>","overlay":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 108 108\"> \u003cpath d=\"M32.25 52.753L32.25 80.9L54 66.827Z\" fill=\"#E08200\" fill-opacity=\"0.16\" stroke=\"#E08200\" stroke-width=\"0.6\" stroke-linejoin=\"round\"/>\u003cpath d=\"M32.25 52.753L54 66.827L54 38.68Z\" fill=\"none\" fill-opacity=\"0\" stroke=\"#E08200\" stroke-width=\"0.6\" stroke-linejoin=\"round\"/>\u003cpath d=\"M32.25 52.753L54 38.68L32.25 24.606Z\" fill=\"#E08200\" fill-opacity=\"0.16\" stroke=\"#E08200\" stroke-width=\"0.6\" stroke-linejoin=\"round\"/>\u003cpath d=\"M28.25 24.606H58\" stroke=\"#E08200\" stroke-width=\"0.6\" stroke-dasharray=\"1.6 1.2\"/> \u003c/svg>","c48":null,"c32":null},{"id":"D-short","label":"A tad shorter","note":"Today's angle, 6.5% shorter: 43.5 × 50.2 dp. The play is unchanged, so it grows to 0.41 of the height, and three plays overshoot by 6.1 dp.","mark":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 108 108\"> \u003cpath f y=\"0\" stroke=\"#E08200\" stroke-width=\"0.6\" stroke-linejoin=\"round\"/>\u003cpath d=\"M34.425 54.033L54 42.731L34.425 31.429Z\" fill=\"#E08200\" fill-opacity=\"0.16\" stroke=\"#E08200\" stroke-width=\"0.6\" stroke-linejoin=\"round\"/>\u003cpath d=\"M30.425 31.429H58\" stroke=\"#E08200\" stroke-width=\"0.6\" stroke-dasharray=\"1.6 1.2\"/> \u003c/svg>","c48":null,"c32":null}],"pickLabel":"Chosen","key":"dstudy"},{"key":"dplay","title":"D, the play's weight","text":["The blind reader's main note on D: the two bars read as pause first, and the play under the left one is small. The earlier, larger D had one advantage, its bigger triangle.","Narrowing the diagonal cut to 0.8 of the slot's width makes the play 8% taller without changing the height, which the notch sets: three plays as before. The cost is that the two cuts are no longer one width, and the play's tip comes closer to the slot: 1.9 dp in the master against 3.1, and about 1 px at 32 px against 2.","You chose the bigger play: it is now D. The one-width version stays here for comparison."],"cuts":true,"items":[{"id":"D-even","label":"One-width cuts","note":"Slot and diagonal one width, 6.2 dp. Play 17.9 × 15.5 dp before the 90%; its tip 3.1 dp short of the slot. At 48 px the play is 11 px tall, at 32 px 8.","mark":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 108 108\"> \u003cg transform=\"translate(54 54) scale(0.9) translate(-54 -54)\">\u003cpath fill=\"#F3F2EE\" fill-rule=\"evenodd\" d=\"M37.368 28.885L48.974 28.885A1.919 1.919 0 0 1 50.893 30.804L50.893 61.439A1.919 1.919 0 0 1 48.014 63.101L33.21 54.554A1.919 1.919 0 0 1 32.25 52.892L32.25 34.003A5.118 5.118 0 0 1 37.368 28.885ZM35.129 62.838L44.907 68.483A1.919 1.919 0 0 1 44.907 71.807L35.129 77.453A1.919 1.919 0 0 1 32.25 75.791L32.25 64.5A1.919 1.919 0 0 1 35.129 62.838ZM59.026 28.885L70.632 28.885A5.118 5.118 0 0 1 75.75 34.003L75.75 75.791A1.919 1.919 0 0 1 72.871 77.453L58.067 68.905A1.919 1.919 0 0 1 57.107 67.243L57.107 30.804A1. 37.368 28.885ZM35.129 61.403L46.15 67.766A1.919 1.919 0 0 1 46.15 71.09L35.129 77.453A1.919 1.919 0 0 1 32.25 75.791L32.25 63.065A1.919 1.919 0 0 1 35.129 61.403ZM59.026 28.885L70.632 28.885A5.118 5.118 0 0 1 75.75 34.003L75.75 75.791A1.919 1.919 0 0 1 72.871 77.453L58.067 68.905A1.919 1.919 0 0 1 57.107 67.243L57.107 30.804A1.919 1.919 0 0 1 59.026 28.885Z\"/>\u003c/g> \u003c/svg>","overlay":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 108 108\"> \u003cg transform=\"translate(54 54) scale(0.9) translate(-54 -54)\">\u003cpath d=\"M32.25 54L32.25 79.115L54 66.557Z\" fill=\"#E08200\" fill-opacity=\"0.16\" stroke=\"#E08200\" stroke-width=\"0.67\" stroke-linejoin=\"round\"/>\u003cpath d=\"M32.25 54L54 66.557L54 41.443Z\" fill=\"none\" fill-opacity=\"0\" stroke=\"#E08200\" stroke-width=\"0.67\" stroke-linejoin=\"round\"/>\u003cpath d=\"M32.25 54L54 41.443L32.25 28.885Z\" fill=\"#E08200\" fill-opacity=\"0.16\" stroke=\"#E08200\" stroke-width=\"0.67\" stroke-linejoin=\"round\"/>\u003cpath d=\"M28.25 28.885H58\" stroke=\"#E08200\" stroke-width=\"0.67\" stroke-dasharray=\"1.8 1.3\"/>\u003c/g> \u003c/svg>","c48":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\"> \u003crect width=\"48\" height=\"48\" rx=\"10.5\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" d=\"M13 8L22 8L22 30.857L10 24L10 11A3 3 0 0 1 13 8ZM10 28L20.5 34L10 40L10 28ZM26 8L35 8A3 3 0 0 1 38 11L38 40L26 33.143L26 8Z\"/> \u003c/svg>","c32":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 32 32\"> \u003crect width=\"32\" height=\"32\" rx=\"7\" fill=\"#111112\"/>\u003cpath fill=\"#F3F2EE\" d=\"M7 4L14 4L14 21.143L5 16L5 6A2 2 0 0 1 7 4ZM5 19L12.875 23.5L5 28L5 19ZM17 4L24 4A2 2 0 0 1 26 6L26 28L17 22.857L17 4Z\"/> \u003c/svg>"}],"pick":"D","pickLabel":"Chosen"}]};
const PAPER = '#F3F2EE', INK = '#17171A', GRAPHITE = '#111112';
const THEMED = { light: { tile: '#D7E8DA', mark: '#1F3A28' }, dark: { tile: '#1F2B23', mark: '#B8DCC2' } };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const C = Object.fromEntries(DATA.cands.concat(DATA.tried || []).map(c => [c.id, c]));
const TRIED = Object.fromEntries(((DATA.page.tried && DATA.page.tried.items) || []).map(t => [t.id, t]));
const ORDER = DATA.page.groups.flatMap(g => g.ids);
const state = { id: [DATA.page.open, DATA.page.pick].find(x => x && C[x]) || ORDER[0] };

// superellipse for the squircle mask (n = 4), in the clip path's 0..1 box
(() => { const pts = []; for (let i = 0; i < 96; i++) { const t = i / 96 * Math.PI * 2, c = Math.cos(t), s = Math.sin(t);
  pts.push(((Math.sign(c) * Math.abs(c) ** .5 + 1) / 2).toFixed(4) + ' ' + ((Math.sign(s) * Math.abs(s) ** .5 + 1) / 2).toFixed(4)); }
  $('sq-path').setAttribute('d', 'M' + pts.join('L') + 'Z'); })();

/* ---------------- drawing ---------------- */
const inner = svg => svg.replace(/^[\s\S]*?<svg[^>]*>/, '').replace(/<\/svg>\s*$/, '');
const recolour = (svg, tile, mark) => svg.replace(/#111112/gi, '@T@').replace(/#F3F2EE/gi, '@M@').replace(/@T@/g, tile).replace(/@M@/g, mark);
// the launcher view: the 108 dp master's central 72 dp on a tile, clipped to a mask shape
function icon(c, size, { shape = 'squircle', tile = GRAPHITE, mark = PAPER, label = '' } = {}) {
  const body = recolour(inner(c.svg.mark), tile, mark);
  return `<span class="ico ${shape}" style="width:${size}px;height:${size}px;background:${tile}"${label ? ` role="img" aria-label="${esc(label)}"` : ' aria-hidden="true"'}><svg xmlns="http://www.w3.org/2000/svg" viewBox="18 18 72 72" focusable="false">${body}</svg></span>`;
}
// the mark alone on the whole 108 canvas (launch screens)
const bare = (c, mark, size) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="${size}" height="${size}" aria-hidden="true" focusable="false">${recolour(inner(c.svg.mark), GRAPHITE, mark)}</svg>`;
// a tuned cut at a CSS size
const cutSvg = (c, k, size, light) => { const s = light ? recolour(c.svg[k], PAPER, INK) : c.svg[k];
  return s.replace('<svg', `<svg width="${size}" height="${size}" aria-hidden="true" focusable="false"`); };
const glyph = (c, size, col = '#FFFFFF') => c.svg.glyph.replace(/#FFFFFF/gi, col).replace('<svg', `<svg width="${size}" height="${size}" aria-hidden="true" focusable="false"`);
// today's icon (shared/brand/src/full.svg), cropped to the launcher's 72 dp
const todayIcon = size => `<span class="ico circle" style="width:${size}px;height:${size}px">${DATA.today.replace(/viewBox="0 0 108 108"/, 'viewBox="18 18 72 72"').replace('<svg', '<svg aria-hidden="true" focusable="false"')}</span>`;
// the 16 px toolbar slot: the 32 px cut on a 2x screen, the 16 px cut on a 1x one
const tool = (c, light) => window.devicePixelRatio >= 1.5 ? cutSvg(c, 'c32', 16, light) : cutSvg(c, 'c16', 16, light);
// the extension's toolbar button: its own drawing where the option has one (the plain bookmark), else the cut
const extBtn = c => { const k = window.devicePixelRatio >= 1.5 ? (c.svg.ext32 ? 'ext32' : 'c32') : (c.svg.ext16 ? 'ext16' : 'c16');
  return c.svg[k].replace('<svg', '<svg width="16" height="16" aria-hidden="true" focusable="false"'); };

const GLYPH = {
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  chat: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
  notes: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8"/><path d="M16 17H8"/>',
  music: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
};
// drawn neighbours on the home screen: generic apps, not real brands
const APPS = [['Clock', 'clock', '#FFFFFF', '#2B3140'], ['Messages', 'chat', '#3D6FD9', '#FFFFFF'], ['Notes', 'notes', '#E9D9B8', '#3A3020'], ['Music', 'music', '#F08A3C', '#FFFFFF']];
const appIcon = ([name, g, bg, fg]) => `<div class="app"><span class="i" style="background:${bg};color:${fg}"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${GLYPH[g]}</svg></span><span>${name}</span></div>`;

function pixels(svg, px, scale, holder, label) {
  const cv = document.createElement('canvas'); cv.width = px; cv.height = px; cv.style.width = px * scale + 'px'; cv.style.height = px * scale + 'px';
  cv.setAttribute('role', 'img'); cv.setAttribute('aria-label', label);
  const img = new Image();
  img.onload = () => { const x = cv.getContext('2d'); x.clearRect(0, 0, px, px); x.drawImage(img, 0, 0, px, px); };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  holder.appendChild(cv);
}

/* ---------------- page ---------------- */
function drawStatic() {
  const P = DATA.page;
  $('eyebrow').textContent = P.eyebrow; $('h1').textContent = P.h1;
  $('lede').textContent = P.lede; $('lede2').textContent = P.lede2;
  $('stays').innerHTML = P.stays.map(([b, t]) => `<span><b>${esc(b)}</b> ${esc(t)}</span>`).join('');
  $('learned').innerHTML = `<h3>${esc(P.learned.title)}</h3><ul>${P.learned.items.map(t => `<li>${esc(t)}</li>`).join('')}</ul>`;
  $('footer').innerHTML = P.footer.map(t => `<p${P.footer[0] === t ? '' : ' class="muted"'}>${esc(t)}</p>`).join('');
}

function drawRows() {
  const btn = (c, wall) => `<button type="button" data-id="${c.id}" aria-pressed="${c.id === state.id}" aria-label="${esc(c.title)}">${icon(c, 48, { shape: 'circle' })}<span>${esc(c.title)}</span></button>`;
  const order = ORDER.map(id => C[id]);
  $('rows').innerHTML =
    `<div class="lrow" style="background:var(--wall-dark);color:#F2F2F2"><div class="in">${order.map(c => btn(c, 'd')).join('')}</div></div>` +
    `<div class="lrow" style="background:var(--wall-light);color:#1F1F1F"><div class="in">${order.map(c => btn(c, 'l')).join('')}</div></div>` +
    `<div class="lrow" style="background:#FFFFFF;color:#1F1F1F"><div class="tb">${order.map(c => `<span class="k">${tool(c, false)}${esc(c.id)}</span>`).join('')}</div></div>` +
    `<div class="lrow" style="background:#35363A;color:#E8EAED"><div class="tb">${order.map(c => `<span class="k">${tool(c, false)}${esc(c.id)}</span>`).join('')}</div></div>`;
}

function drawPickers() {
  const card = c => `<button class="cand" type="button" data-id="${c.id}" aria-pressed="${c.id === state.id}">${icon(c, 64)}<span class="meta"><b>${esc(c.title)}${c.id === DATA.page.pick ? `<span class="pickmark">${esc(DATA.page.pickLabel || 'My pick')}</span>` : ''}</b><span class="mono">${esc(c.id)}</span><span class="one">${esc(c.one || c.idea)}</span></span></button>`;
  $('pickers').innerHTML = `<a class="peek" id="peek" href="#panel"></a>` + DATA.page.groups.map((g, i) =>
    `<section class="group" aria-labelledby="g${i}"><div class="group-head"><h2 id="g${i}">${esc(g.title)}</h2>${g.text ? `<p>${esc(g.text)}</p>` : ''}</div><div class="grid">${g.ids.map(id => card(C[id])).join('')}</div></section>`).join('');
}

function drawStudies() {
  const one = (S, it) => {
    const c = { svg: { mark: it.mark } };
    const cons = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 18 72 72" role="img" aria-label="${esc(it.label)}${it.overlay ? ': the mark with three interlocked plays outlined' : ''}"><rect x="18" y="18" width="72" height="72" fill="${GRAPHITE}"/>${inner(it.mark)}${it.overlay ? inner(it.overlay) : ''}</svg>`;
    const cuts = it.c48 ? `<div style="background:#F1F3F4;border-radius:10px;padding:10px 6px;display:grid;gap:10px">
        <div class="row">${it.c48.replace('<svg', '<svg width="48" height="48" aria-hidden="true" focusable="false"')}${it.c32.replace('<svg', '<svg width="32" height="32" aria-hidden="true" focusable="false"')}<span style="font-size:11px;color:#5C5B56">48 and 32 px at 1×</span></div>
        <div class="row"><span class="px" data-svg="${encodeURIComponent(it.c48)}" data-n="48" data-z="2"></span><span class="px" data-svg="${encodeURIComponent(it.c32)}" data-n="32" data-z="3"></span></div>
        <p class="cap" style="margin:0;color:#5C5B56">magnified: 48 px ×2, 32 px ×3</p></div>` : '';
    return `<article class="dcard"><h3>${esc(it.label)}${it.id === S.pick ? `<span class="pickmark">${esc(S.pickLabel || 'My pick')}</span>` : ''}</h3>
      <div class="cons">${cons}</div>
      <div class="row">
        <span class="wb" style="background:linear-gradient(160deg,#4A5A6E,#1C2331)">${icon(c, 76, { label: it.label + ', app icon' })}</span>
        <span class="wb" style="background:var(--wall-light)">${icon(c, 48, { tile: PAPER, mark: INK, label: it.label + ', light version' })}</span>
        <span class="wb" style="background:var(--wall-light)">${icon(c, 48, { shape: 'circle', tile: THEMED.light.tile, mark: THEMED.light.mark, label: it.label + ', themed icon' })}</span>
      </div>
      <div class="row" style="background:var(--wall-dark);border-radius:10px;padding:10px 6px">${icon(c, 40, { shape: 'circle' })}${icon(c, 40, { shape: 'squircle' })}<span style="color:#F2F2F2;font-size:11px">1× home screen</span></div>
      ${cuts}
      <p>${esc(it.note)}</p></article>`;
  };
  $('studies').innerHTML = (DATA.studies || []).map(S => `<section class="dstudy" id="${esc(S.key)}" aria-labelledby="h-${esc(S.key)}"><div class="head"><h2 id="h-${esc(S.key)}">${esc(S.title)}</h2>${S.text.map(x => `<p>${esc(x)}</p>`).join('')}</div><div class="dgrid">${S.items.map(it => one(S, it)).join('')}</div></section>`).join('');
  for (const el of document.querySelectorAll('#studies .px')) {
    const f = document.createElement('figure'); f.style.margin = '0';
    pixels(decodeURIComponent(el.dataset.svg), +el.dataset.n, +el.dataset.z, f, 'magnified cut'); el.appendChild(f);
  }
}

function drawTried() {
  const T = DATA.page.tried; if (!T) return;
  $('tried').innerHTML = `<div class="head"><h2 id="h-tried">${esc(T.title)}</h2><p>${esc(T.text)}</p></div><div class="tgrid">${T.items.map(t => { const c = C[t.id];
    return `<button class="tcard" type="button" data-id="${c.id}" aria-pressed="${c.id === state.id}">${icon(c, 48, { shape: 'circle' })}<span class="meta"><b>${esc(c.title)}</b><span class="mono">${esc(c.id)} · round one</span>${t.became ? `<span class="dev">${esc(t.became)}</span>` : ''}<span class="why">${esc(t.why)}</span></span></button>`; }).join('')}</div>`;
}

    <div class="sec"><h3>On the lock screen, listening</h3>
      <div class="lock" role="img" aria-label="A lock screen with Shelf's media notification while an article is read aloud">
        <div class="status"><span class="mono" style="font-size:12px">9:41</span>${glyph(c, 18)}<span class="sp" aria-hidden="true"><svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M1 13h2v2H1zM5 10h2v5H5zM9 7h2v8H9zM13 3h2v12h-2z"/></svg><svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M8 14 1 6.5a10 10 0 0 1 14 0Z"/></svg><svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><rect x="5" y="2" width="6" height="13" rx="1.5"/><rect x="6.5" y="0.5" width="3" height="2" rx=".5"/></svg></span></div>
        <div class="media">
          <span class="art">${DATA.cover.replace('<svg', '<svg width="64" height="64" aria-hidden="true" focusable="false"')}</span>
          <div><div class="app">${glyph(c, 16)}<span>Shelf</span></div><div class="t">The quiet economics of the library</div><div class="s">example.org · 14 min</div></div>
          <div class="ctl"><span class="mono" style="font-size:11px">5:12</span><span class="bar"><i></i></span><span class="mono" style="font-size:11px">14:03</span><span class="pp"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></span></div>
        </div>
      </div>
      <p class="muted" style="font-size:12px">The status bar and the notification's header use the one-colour glyph (24 px drawing, shown at 18 and 16 px); the artwork is the article's own cover (here the cover behind today's icon, as a stand-in).</p>
    </div>
    <div class="sec"><h3>In the browser, real size</h3>
      <div class="chrome" style="background:#FFFFFF;color:#1F1F1F;box-shadow:inset 0 0 0 1px #DADCE0"><span class="tab" style="background:#DFE1E5">${tool(c)}Shelf</span><span class="omni" style="background:#F1F3F4">shelf.example/saves</span>${extBtn(c)}</div>
      <div class="chrome" style="background:#35363A;color:#E8EAED"><span class="tab" style="background:#202124">${tool(c)}Shelf</span><span class="omni" style="background:#202124">shelf.example/saves</span>${extBtn(c)}</div>
      <div class="pix" id="pix"></div>
      ${c.svg.ext16 ? '<p class="muted" style="font-size:12px">The tab shows the site\'s favicon, the option\'s own cut; the button at the end of the toolbar is the extension\'s, the plain bookmark, since the extension only saves.</p>' : ''}
    </div>
    <div class="sec"><h3>Launch screens</h3><div class="screens">
      <figure><div class="scr" style="background:${GRAPHITE}">${bare(c, PAPER, 112)}</div>Dark theme</figure>
      <figure><div class="scr" style="background:${PAPER}">${bare(c, INK, 112)}</div>Light theme</figure>
    </div></div>
    <div class="sec"><h3>How it is drawn</h3><div class="notes"><dl>
      <div><dt>Built</dt><dd>${esc(c.built)}</dd></div>
      <div><dt>Small sizes</dt><dd>${esc(c.small)}</dd></div>
      <div><dt>Risks</dt><dd>${esc(c.risks)}</dd></div>
    </dl></div></div>
    ${TRIED[c.id] ? `<div class="sec"><h3>Why it stopped at round one</h3><div class="judges"><p>${esc(TRIED[c.id].became ? TRIED[c.id].became + ' ' : '')}${esc(TRIED[c.id].why)}</p></div></div>` : ''}
    ${judges ? `<div class="sec"><h3>What reviewers said</h3><div class="judges">${judges}</div></div>` : ''}`;
  $('peek').innerHTML = icon(c, 40) + `<span>${esc(c.title)}</span><span class="muted" style="margin-left:auto">See it in context</span>`;
  const pix = $('pix');
  [['16 px, ×8', 'c16', 16, 8], ['32 px, ×4', 'c32', 32, 4], ['48 px, ×3', 'c48', 48, 3], ['Glyph, 24 px, ×5', 'glyph', 24, 5],
   ...(c.svg.ext16 ? [['Extension button, 16 px, ×8', 'ext16', 16, 8], ['Extension button, 32 px, ×4', 'ext32', 32, 4]] : [])].forEach(([cap, k, px, sc]) => {
    const f = document.createElement('figure');
    let svg = c.svg[k];
    if (k === 'glyph') svg = svg.replace(/(<svg[^>]*>)/, '$1<rect width="24" height="24" fill="#000000"/>');
    pixels(svg, px, sc, f, `${c.title}: ${cap}`);
    const cp = document.createElement('figcaption'); cp.textContent = cap; f.appendChild(cp); pix.appendChild(f);
  });
}

function update() {
  drawRows(); drawPickers(); drawTried(); drawPanel();
  try { history.replaceState(null, '', '#' + state.id); } catch (e) {}
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-id]'); if (!b) return;
  state.id = b.dataset.id;
  const fromRow = !!b.closest('.lrow'), wall = fromRow && b.closest('.lrow') === b.closest('.rows').children[1] ? 1 : 0;
  update();
  const fromTried = !!b.closest('.tried');
  const again = fromRow ? $('rows').children[wall].querySelector(`[data-id="${state.id}"]`) : document.querySelector(`${fromTried ? '.tcard' : '.cand'}[data-id="${state.id}"]`);
  if (again) again.focus({ preventScroll: true });
  if ((fromRow || fromTried) && window.matchMedia('(max-width:1000px)').matches) $('panel').scrollIntoView({ block: 'start' });
  else if (fromTried) $('panel').scrollIntoView({ block: 'nearest' });
});
(() => { const h = (location.hash || '').slice(1); if (C[h]) state.id = h; })();
drawStatic();
drawStudies();
update();
</script>
